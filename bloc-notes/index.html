<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bloc’ Notes · Atelier UNAC</title>
<link rel="icon" href="../commun/icons-atelier/favicon.png">
<link rel="apple-touch-icon" href="../commun/icons-atelier/apple-touch-icon.png">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Atelier UNAC">
<meta name="theme-color" content="#5b1a3a">
<meta name="robots" content="noindex, nofollow">
<script src="../commun/acces.js"></script>
<style>
  @font-face{font-family:"T1";src:url("../commun/polices/x1.woff2") format("woff2");font-weight:400;font-display:block}
  @font-face{font-family:"T1";src:url("../commun/polices/x2.woff2") format("woff2");font-weight:700 800;font-display:block}
  :root{--mag:#C2286A;--mag2:#A01A55;--rosepale:#FBE4EC;--ui-bg:#f6f1f4;--ui-card:#fff;--ui-line:#e7dbe2;--ui-ink:#2b1225;--ui-muted:#8b6f80}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"T1",Inter,system-ui,-apple-system,sans-serif;background:var(--ui-bg);color:var(--ui-ink);display:flex;flex-direction:column}
  button,input,textarea,select{font:inherit;color:inherit}

  /* Barre du haut */
  .top{display:flex;align-items:center;gap:14px;padding:10px 18px;background:linear-gradient(100deg,#7a2a4e 0%,#5e1d3c 60%,#4f1530 100%);color:#fff;flex:none}
  .top a.home{display:block}
  .top img.logo{height:34px;display:block}
  .top h1{font-size:16px;font-weight:700;letter-spacing:.02em;line-height:1.15}
  .top h1 small{display:block;font-weight:400;font-size:11.5px;opacity:.75}
  .top .sp{flex:1}
  .acts{display:flex;gap:8px;align-items:center}
  .btn{border:0;border-radius:9px;padding:9px 14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
  .btn svg{width:16px;height:16px;flex:none}
  .btn.pdf{background:#fff;color:#7a1f48}
  .btn.ghost{background:rgba(255,255,255,.14);color:#fff}
  .btn.ghost:hover{background:rgba(255,255,255,.24)}
  .menu{position:relative}
  .menu .dd{position:absolute;right:0;top:calc(100% + 6px);background:#fff;color:var(--ui-ink);border-radius:12px;box-shadow:0 12px 36px rgba(40,0,25,.28);padding:6px;min-width:270px;display:none;z-index:50}
  .menu.open .dd{display:block}
  .dd button{display:flex;width:100%;text-align:left;border:0;background:none;padding:9px 11px;border-radius:8px;cursor:pointer}
  .dd button:hover{background:var(--rosepale)}
  .dd button small{display:block;color:var(--ui-muted);font-size:11.5px}
  .dd hr{border:0;border-top:1px solid var(--ui-line);margin:4px 6px}

  .app{flex:1;display:grid;grid-template-columns:minmax(380px,520px) 1fr;min-height:0}
  .form{overflow:auto;padding:18px 18px 60px;border-right:1px solid var(--ui-line)}
  .preview{overflow:auto;background:#3a3036;padding:26px 20px 60px}
  .tabs{display:none}
  .card{background:var(--ui-card);border:1px solid var(--ui-line);border-radius:14px;padding:14px;margin-bottom:12px}
  .card h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#9b3e69;margin-bottom:10px;font-weight:700;display:flex;align-items:center;gap:8px}
  .card h2 .st{margin-left:auto;font-size:10.5px;letter-spacing:.08em;background:#f1edf0;color:#7d5a6e;border-radius:999px;padding:2px 9px}
  .card h2 .st.pub{background:#e3f4ea;color:#23764a}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  label.f{display:block;font-size:12px;color:var(--ui-muted);margin:10px 0 4px}
  label.f:first-of-type{margin-top:0}
  input[type=text],textarea,select{width:100%;border:1px solid var(--ui-line);border-radius:9px;padding:8px 10px;background:#fff;outline:none;font-size:14px}
  input:focus,textarea:focus,select:focus{border-color:#c8487f;box-shadow:0 0 0 3px rgba(200,72,127,.15)}
  textarea{resize:vertical;min-height:64px;line-height:1.4}
  .chk{display:flex;gap:8px;align-items:center;font-size:13.5px;cursor:pointer}
  .chk input{accent-color:#b0386c;width:16px;height:16px}
  .hint{font-size:11.5px;color:var(--ui-muted);margin-top:6px;line-height:1.4}
  .imp{background:#fffde0;border-color:#efe48a}
  .item .ih{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .item .ih .num{font-weight:800;color:#9b3e69;font-size:13px;width:22px}
  .item .ih select{flex:1}
  .mini{border:1px solid var(--ui-line);background:#fff;border-radius:8px;padding:5px 9px;font-size:12px;cursor:pointer;color:#6d3a55}
  .mini:hover{background:var(--rosepale)}
  .mini.danger{color:#a3263b}
  .add{width:100%;border:1.5px dashed #d9b3c5;background:#fdf7fa;color:#9b3e69;border-radius:12px;padding:11px;font-weight:700;cursor:pointer}
  .add:hover{background:var(--rosepale)}
  .pubcard{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-top:12px}
  .pubcard b{display:block;font-size:14px}
  .pubcard span{display:block;font-size:12px;color:var(--ui-muted);margin-top:2px}
  .pubbtn{background:#23764a;color:#fff}
  .robanner{background:#e3f4ea;border:1px solid #bfe3cd;border-radius:14px;padding:12px 14px;margin-bottom:12px;color:#1d5c3a}
  .robanner b{display:block}
  .robanner span{display:block;font-size:12px;margin-top:2px}
  .robanner .mini{margin-top:8px}
  body.ro .form .card:not(.robanner), body.ro .form .add{pointer-events:none;opacity:.6}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#2b1225;color:#fff;padding:11px 18px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:99}
  .toast.on{opacity:1;transform:translateX(-50%)}
  .pv-meta{color:#d9c6d0;font-size:12px;text-align:center;margin-bottom:14px}
  .pwrap{margin:0 auto 22px;box-shadow:0 10px 34px rgba(0,0,0,.45);position:relative}
  .pwrap > .page{transform-origin:0 0;position:absolute;left:0;top:0}

  /* Fenêtres (historique, images) */
  .modal{position:fixed;inset:0;background:rgba(30,6,20,.55);display:none;align-items:center;justify-content:center;z-index:80;padding:16px}
  .modal.on{display:flex}
  .mbox{background:#fff;border-radius:16px;width:min(860px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.35)}
  .mhead{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--ui-line)}
  .mhead h3{font-size:16px}
  .mclose{border:0;background:none;font-size:26px;line-height:1;cursor:pointer;color:var(--ui-muted)}
  .mbody{overflow:auto;padding:16px 18px;flex:1}
  .mfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 18px;border-top:1px solid var(--ui-line)}
  .mbtn{border:1px solid var(--ui-line);background:#fff;border-radius:9px;padding:9px 14px;font-weight:700;cursor:pointer}
  .mbtn.pri{background:#9b2f60;border-color:#9b2f60;color:#fff}
  .mintro{font-size:13.5px;color:#5d4252;line-height:1.45;margin-bottom:14px}
  .merr{background:#fff4ec;color:#9a3f17;border-radius:9px;padding:10px 12px;font-size:13px}
  .imgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .imgrid a{display:block;text-decoration:none;color:var(--ui-muted);font-size:12px;text-align:center}
  .imgrid img{width:100%;display:block;border-radius:8px;box-shadow:0 4px 14px rgba(40,0,25,.25);margin-bottom:6px}
  .htabs{display:flex;gap:6px;margin-bottom:12px}
  .htabs button{border:1px solid var(--ui-line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:700;cursor:pointer;color:#7d5a6e}
  .htabs button.on{background:#7a2a4e;border-color:#7a2a4e;color:#fff}
  .hrow{display:flex;align-items:center;gap:12px;border:1px solid var(--ui-line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
  .hrow.cur{border-color:#c8487f}
  .hrow .hi{flex:1;min-width:0}
  .hrow .hi b{display:block;font-size:14.5px}
  .hrow .hi span{display:block;font-size:12px;color:var(--ui-muted);margin-top:2px}
  .hrow .ha{display:flex;gap:6px;flex-wrap:wrap}
  .hempty{text-align:center;color:var(--ui-muted);padding:30px}

  /* ===== LA FRAME (A4 = 794 × 1123 px) ===== */
  .page{width:794px;height:1123px;position:relative;overflow:hidden;background:#fff;color:#3b3b3b;display:flex;flex-direction:column;
    font-family:"T1",Inter,system-ui,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact;
    --gap:18px;--pad:28px;--ft:15.5px;--fx:12.6px}
  .page .content{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column}
  .page.cont .content{padding-top:40px}
  .page .foot{position:absolute;left:48px;right:48px;bottom:18px;display:flex;justify-content:space-between;font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:#b2a5ac}
  .page .bottomgap{height:46px;flex:none}
  .hd{position:relative;height:196px;flex:none}
  .hd .plume{position:absolute;left:0;top:0;width:100px}
  .hd .bntitre{position:absolute;left:48px;top:106px;height:31px;width:auto}
  .hd .sous{position:absolute;left:49px;top:146px;font-size:14px;color:#9d9d9d}
  .hd .ed{position:absolute;right:48px;top:150px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mag);font-weight:700}
  .hd .logohop{position:absolute;right:48px;top:30px;height:104px}
  .hd .ligne{position:absolute;left:0;right:0;top:183px;height:3px;background:linear-gradient(90deg,#C2286A 0%,#C2286A 35%,rgba(194,40,106,.15) 85%,rgba(194,40,106,0) 100%)}
  .impb{flex:none;margin:26px 0 8px}
  .impb .bar{background:var(--mag);color:#fff;text-align:center;font-weight:700;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;padding:8px 0 7px}
  .impb .jaune{background:#FFFA00;padding:20px 48px 22px;color:#2f2f2f}
  .impb .jaune h3{font-size:var(--ft);font-weight:400;margin-bottom:9px}
  .impb .jaune h3 b{font-weight:700}
  .impb .jaune p{font-size:var(--fx);line-height:1.42;white-space:pre-wrap;text-align:justify;hyphens:auto}
  .it{flex:none;position:relative;margin:var(--gap) 48px 0 48px;padding-top:15px}
  .it .tag{position:absolute;left:0;top:0;display:flex;align-items:center;gap:12px;z-index:1}
  .it .pill{background:var(--mag);color:#fff;font-weight:700;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;border-radius:8px;padding:8px 9px 7px;line-height:1}
  .it .ic{width:30px;height:30px;color:var(--mag);background:#fff;border-radius:6px}
  .it .boite{margin-left:27px;background:#f4f4f4;border-radius:22px;padding:calc(var(--pad) + 6px) 30px var(--pad) 30px}
  .it h3{font-size:var(--ft);font-weight:400;color:var(--mag);margin-bottom:8px}
  .it h3 b{font-weight:700}
  .it p{font-size:var(--fx);line-height:1.42;color:#3d3d3d;white-space:pre-wrap;text-align:justify;hyphens:auto;max-width:92%}
  .it p b, .impb p b{font-weight:700}
  .fin{flex:none;margin-top:auto;padding:24px 48px 0}
  .fin .appli{display:inline-flex;align-items:center;gap:10px;background:#f4f4f4;border-radius:14px;padding:9px 14px 9px 9px}
  .fin .appli img{width:32px;height:32px;border-radius:8px}
  .fin .appli b{display:block;font-size:11.5px;color:var(--mag)}
  .fin .appli span{display:block;font-size:9px;color:#777;margin-top:1px}

  @page{size:A4;margin:0}
  @media print{
    html,body{background:none;height:auto;display:block}
    .top,.form,.tabs,.pv-meta,.toast,.modal{display:none!important}
    .app{display:block}
    .preview{overflow:visible;padding:0;background:none}
    .pwrap{margin:0;box-shadow:none;width:auto!important;height:auto!important;position:static}
    .pwrap > .page{position:relative;transform:none!important;break-after:page}
    .pwrap:last-child > .page{break-after:auto}
  }
  @media screen and (max-width:900px){
    .top{flex-wrap:wrap;gap:10px;padding:10px 12px}
    .top h1{font-size:14px}
    .top .sp{display:none}
    .acts{width:100%;justify-content:space-between}
    .top .lg{display:none}
    .top .btn{padding:9px 12px}
    .app{grid-template-columns:1fr}
    .tabs{display:flex;background:#fff;border-bottom:1px solid var(--ui-line);flex:none}
    .tabs button{flex:1;border:0;background:none;padding:11px;font-weight:700;color:var(--ui-muted);border-bottom:3px solid transparent}
    .tabs button.on{color:#8a2b57;border-color:#b0386c}
    body.tab-apercu .form{display:none}
    body:not(.tab-apercu) .preview{display:none}
    .form{border-right:0;padding:12px 12px 80px}
  }
</style>
</head>
<body>
<div class="top">
  <a href="../" class="home" title="Retour à l'Atelier UNAC"><img class="logo" src="../commun/img/logo-unac-blanc.png" alt="Atelier UNAC"></a>
  <h1 id="h1">Bloc’ Notes<small>Bulletin d'informations utiles — mise en page automatique</small></h1>
  <div class="sp"></div>
  <div class="acts">
    <button class="btn ghost" id="histBtn" title="Bloc’ Notes publiés et brouillons"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v5l3 2"/><circle cx="12" cy="12" r="9"/></svg><span class="lg">Historique</span></button>
    <button class="btn ghost" id="resetBtn" title="Nouveau Bloc’ Notes vierge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg><span class="lg">Recommencer</span></button>
    <div class="menu" id="menu">
      <button class="btn ghost" id="menuBtn"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg><span class="lg">Brouillon</span></button>
      <div class="dd">
        <button id="aPublish"><div>Publier ce Bloc’ Notes<small>Il passe dans « Publiés » et n'est plus modifiable.</small></div></button>
        <hr>
        <button id="aShare"><div>Copier le lien de partage<small>Le brouillon est contenu dans le lien.</small></div></button>
        <button id="aSave"><div>Enregistrer le brouillon (.json)</div></button>
        <button id="aOpen"><div>Ouvrir un brouillon (.json)</div></button>
        <hr>
        <button id="aDemo"><div>Charger un exemple</div></button>
      </div>
    </div>
    <button class="btn ghost" id="imgBtn" title="Une image par page, pour Facebook"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="10" r="1.8"/><path d="m21 16-5-5-8 9"/></svg><span class="lg">Images</span></button>
    <button class="btn pdf" id="pdfBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg><span class="lg">Télécharger le&nbsp;</span>PDF</button>
  </div>
</div>
<div class="tabs" id="tabs"><button data-tab="saisie" class="on">Saisie</button><button data-tab="apercu">Aperçu</button></div>
<div class="app">
  <div class="form" id="form"></div>
  <div class="preview" id="preview"><div class="pv-meta" id="pvMeta"></div><div id="pages"></div></div>
</div>
<input type="file" id="fileJson" accept="application/json,.json" hidden>
<div class="toast" id="toast"></div>

<div class="modal" id="histModal"><div class="mbox" role="dialog" aria-modal="true">
  <div class="mhead"><h3>Historique des Bloc’ Notes</h3><button class="mclose" data-x aria-label="Fermer">×</button></div>
  <div class="mbody" id="hBody"></div>
  <div class="mfoot"><button class="mbtn" id="hNew">+ Nouveau Bloc’ Notes</button><button class="mbtn pri" data-x>Fermer</button></div>
</div></div>

<script>
"use strict";
const MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2,9);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const moisLabel = m => { const [y,mm] = m.split("-"); return MOIS[+mm-1] + " " + y; };
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("on"), 2600); }

/* Rubriques et pictos (trait magenta) */
const P = (d) => `<svg class="ic" viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const RUBRIQUES = {
  "Plannings":      P('<path d="M6 7h9M6 12h6M6 17h4M6 22h9"/><rect x="4" y="4" width="14" height="22" rx="2"/><circle cx="23" cy="9" r="3"/><path d="M23 12v6a3 3 0 0 1-3 3"/><circle cx="18" cy="23" r="2"/>'),
  "Rémunération":   P('<circle cx="15" cy="15" r="11"/><path d="M19 10.5a5 5 0 1 0 0 9M9 13.5h7M9 16.5h7"/>'),
  "Repos & congés": P('<path d="M23 18.5A9 9 0 1 1 13.5 6a7 7 0 0 0 9.5 12.5z"/><path d="M21 5v4M19 7h4"/>'),
  "Hébergement":    P('<path d="M4 23V9M4 18h22v5M26 18v-3a3 3 0 0 0-3-3h-9v6"/><circle cx="9" cy="14" r="2.3"/>'),
  "Sécurité":       P('<path d="M15 4l9 3.5v7c0 6-4 9.5-9 11.5-5-2-9-5.5-9-11.5v-7z"/><path d="M11 15l3 3 5-6"/>'),
  "Santé":          P('<path d="M15 25s-10-6-10-13a5.5 5.5 0 0 1 10-3 5.5 5.5 0 0 1 10 3c0 7-10 13-10 13z"/><path d="M8 15h4l2-3 2.5 6 2-3H22"/>'),
  "Formation":      P('<path d="M3 11l12-6 12 6-12 6z"/><path d="M8 13.5V20c4 3 10 3 14 0v-6.5M27 11v7"/>'),
  "Carrière":       P('<path d="M4 24h22"/><path d="M6 19l6-6 4 4 8-9"/><path d="M19 8h5v5"/>'),
  "Réglementation": P('<path d="M15 4v21M8 25h14M6 8h18"/><path d="M6 8l-3.5 8a3.5 3.5 0 0 0 7 0zM24 8l-3.5 8a3.5 3.5 0 0 0 7 0z"/>'),
  "Vie syndicale":  P('<path d="M5 12v6h4l10 5V7L9 12z"/><path d="M9 18l1.5 6h3L12 19M23 11.5a4 4 0 0 1 0 7"/>'),
  "Escales":        P('<path d="M15 26s8-7.5 8-14a8 8 0 0 0-16 0c0 6.5 8 14 8 14z"/><circle cx="15" cy="12" r="3"/>'),
  "Vols & rotations": P('<path d="M27 15l-10-5V5a2 2 0 0 0-4 0v5L3 15v3l10-2.5V21l-3 2v2l5-1.5 5 1.5v-2l-3-2v-5.5L27 18z"/>'),
  "Info":           P('<circle cx="15" cy="15" r="11"/><path d="M15 14v7"/><circle cx="15" cy="9.5" r=".6" fill="currentColor"/>')
};

/* ---------- État : plusieurs Bloc' Notes mémorisés sur l'appareil ---------- */
const HOP = new URLSearchParams(location.search).get("section") === "hop";
const DOCS_KEY = HOP ? "bnhop:docs" : "bn:docs", CUR_KEY = HOP ? "bnhop:current" : "bn:current";
const NOM_SECTION = HOP ? "UNAC HOP!" : "UNAC";
if(HOP){ document.getElementById("h1").firstChild.textContent = "Bloc’ Notes HOP! "; document.title = document.title.replace("Bloc", "Bloc").replace(/Bloc’ Notes|Bloc' Notes/, "Bloc’ Notes HOP!"); }
let DOCS = {}, S = null;
function moisDefaut(){ const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function blank(){
  return {v:1, id:uid(), statut:"brouillon", cree:Date.now(), maj:Date.now(), mois:moisDefaut(), edition:"", sous:"Votre bulletin d’informations utiles",
    important:{actif:true, titreA:"", titreB:"", texte:""}, items:[{id:uid(), rubrique:"Plannings", titreA:"", titreB:"", texte:""}]};
}
function hasContent(d){ return !!(d.important.titreA || d.important.titreB || d.important.texte || d.items.some(i => i.titreA || i.titreB || i.texte)); }
function persist(){ try{ localStorage.setItem(DOCS_KEY, JSON.stringify(DOCS)); localStorage.setItem(CUR_KEY, S.id); }catch(e){ toast("Mémoire de l'appareil pleine"); } }
let saveT = null;

function openDoc(d){

function buildPages(box){
  box.innerHTML = "";

  const next = () => { idx++; c = newPage(box, idx); };
  const place = node => { c.appendChild(node); if(overflows(c) && c.children.length > 1){ c.removeChild(node); next(); c.appendChild(node); } };
  const I = S.important;
  if(I.actif && (I.titreA || I.titreB || I.texte.trim()))
    place(el(`<div class="impb"><div class="bar">Important à savoir !</div><div class="jaune">${(I.titreA||I.titreB) ? `<h3>${esc(I.titreA)}${I.titreB ? ` <b>${esc(I.titreB)}</b>` : ""}</h3>` : ""}${I.texte.trim() ? `<p>${fmt(I.texte.trim())}</p>` : ""}</div></div>`));

}

function renderPreview(){
  const stage = document.createElement("div"); stage.style.cssText = "position:fixed;left:-20000px;top:0;visibility:hidden;width:900px"; document.body.appendChild(stage);
  let best = null;
  for(let i=0;i<DENSITES.length;i++){ DENS = DENSITES[i]; const n = buildPages(stage); if(!best || n < best.n) best = {i, n}; if(n === 1) break; }
  DENS = DENSITES[best.i]; const n = buildPages(stage);
  const box = $("#pages"); box.innerHTML = ""; while(stage.firstChild) box.appendChild(stage.firstChild); stage.remove();
  fitPreview();
  const nb = S.items.filter(it => it.titreA || it.titreB || it.texte.trim()).length;
  $("#pvMeta").textContent = `${n} page${n>1?"s":""} · ${nb} information${nb>1?"s":""} · mise en page ${DENS.nom} (auto) · A4`;
}

async function deflate(str){
  const cs = new Blob([new TextEncoder().encode(str)]).stream().pipeThrough(new CompressionStream("deflate-raw"));
  const buf = new Uint8Array(await new Response(cs).arrayBuffer());
  return btoa(String.fromCharCode(...buf)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
async function inflate(s){
  let b = s.replace(/-/g,"+").replace(/_/g,"/"); while(b.length % 4) b += "=";
  const ds = new Blob([Uint8Array.from(atob(b), c => c.charCodeAt(0))]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return await new Response(ds).text();
}
function recevoir(o){
  if(!o || !Array.isArray(o.items)) return toast("Brouillon non reconnu");
  const d = Object.assign(blank(), o, {id:uid(), statut:"brouillon", cree:Date.now(), maj:Date.now()});

}
