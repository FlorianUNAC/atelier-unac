<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Papier à en-tête UNAC · Atelier UNAC</title>
<link rel="icon" href="../commun/icons-atelier/favicon.png">
<script src="../commun/acces.js"></script>
<link rel="stylesheet" href="papier.css?v=apercu-exemple">
<script src="papier.js?v=exemple-lorem" defer></script>
</head>
<body>
<main class="atelier">
  <a class="retour" href="../#af">← Atelier UNAC</a>
  <h1>Papier à en-tête UNAC</h1>
  <div class="espace">
    <form class="editeur" autocomplete="off">
      <p>Renseignez les champs utiles ou imprimez le modèle vierge. Pour obtenir un PDF, choisissez « Enregistrer au format PDF » dans la fenêtre d’impression.</p>
      <label>Destinataire<input data-champ="destinataire" maxlength="160"></label>
      <label>Fonction du destinataire<input data-champ="fonction" maxlength="160"></label>
      <label>Adresse du destinataire<textarea data-champ="adresse" rows="2" maxlength="500"></textarea></label>
      <div class="ligne">
        <label>Lieu<input data-champ="lieu" value="Roissy" maxlength="120"></label>
        <label>Date<input data-champ="date" type="date"></label>
      </div>
      <label>Objet<input data-champ="objet" maxlength="240"></label>
      <label>Corps du courrier<textarea data-champ="courrier" rows="9"></textarea></label>
      <label>Nom du signataire<input data-champ="signataire" maxlength="160"></label>
      <label>Fonction du signataire<input data-champ="mandat" maxlength="160"></label>
      <div class="actions">
        <button type="submit" disabled>Imprimer le courrier</button>
        <button type="button" id="modele-vierge">Imprimer le modèle vierge</button>
      </div>
    </form>
    <section class="apercu" aria-labelledby="titre-apercu">
      <h2 id="titre-apercu">Aperçu du courrier</h2>
      <p id="info-exemple">Exemple de mise en page. Votre courrier apparaîtra ici dès la première saisie.</p>
      <article class="papier">
        <div class="filigrane" aria-hidden="true" hidden><span>EXEMPLE</span></div>
        <header class="entete">
          <img src="entete-unac.png" width="1203" height="200" alt="UNAC · Union des navigants de l’aviation civile">
        </header>
        <table class="pagination" role="presentation">
          <thead aria-hidden="true"><tr><td></td></tr></thead>
          <tbody><tr><td class="lettre">
            <div class="coordonnees">
              <strong data-apercu="destinataire" hidden></strong>
              <em data-apercu="fonction" hidden></em>
              <div data-apercu="adresse" hidden></div>
              <div class="date-lettre" data-apercu="date-lettre" hidden></div>
            </div>
            <p class="objet" data-apercu="objet" hidden></p>
            <div class="courrier" data-apercu="courrier" hidden></div>
            <div class="signature">
              <strong data-apercu="signataire" hidden></strong>
              <em data-apercu="mandat" hidden></em>
            </div>
          </td></tr></tbody>
          <tfoot aria-hidden="true"><tr><td></td></tr></tfoot>
        </table>
        <footer class="pied">
          <img src="pied-unac.png" width="1203" height="118" alt="UNAC · 45 rue de Paris, 95747 Tremblay-en-France · Bâtiment Pégase, 2e étage, aile Sud">
        </footer>
      </article>
    </section>
  </div>
</main>
</body>
</html>
