<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chrono’ · Atelier UNAC</title>
<link rel="icon" href="../commun/icons/favicon.png">
<link rel="apple-touch-icon" href="../commun/icons/apple-touch-icon.png">
<meta name="theme-color" content="#5b1a3a">
<meta name="robots" content="noindex, nofollow">
<script src="../commun/acces.js"></script>
<style>
  @font-face{font-family:"T1";src:url("../commun/polices/x1.woff2") format("woff2");font-weight:400;font-display:block}
  @font-face{font-family:"T1";src:url("../commun/polices/x2.woff2") format("woff2");font-weight:700 800;font-display:block}
  :root{--mag:#C2286A;--mag2:#A01A55;--rosepale:#FBE4EC;--ui-bg:#f6f1f4;--ui-card:#fff;--ui-line:#e7dbe2;--ui-ink:#2b1225;--ui-muted:#8b6f80}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"T1",Inter,system-ui,-apple-system,sans-serif;background:var(--ui-bg);color:var(--ui-ink);display:flex;flex-direction:column}
  button,input,textarea,select{font:inherit;color:inherit}

  /* Barre du haut */
  .top{display:flex;align-items:center;gap:14px;padding:10px 18px;background:linear-gradient(100deg,#7a2a4e 0%,#5e1d3c 60%,#4f1530 100%);color:#fff;flex:none}
  .top a.home{display:block}
  .top img.logo{height:34px;display:block}
  .top h1{font-size:16px;font-weight:700;letter-spacing:.02em;line-height:1.15}
  .top h1 small{display:block;font-weight:400;font-size:11.5px;opacity:.75}
  .top .sp{flex:1}
  .acts{display:flex;gap:8px;align-items:center}
  .btn{border:0;border-radius:9px;padding:9px 14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
  .btn svg{width:16px;height:16px;flex:none}
  .btn.pdf{background:#fff;color:#7a1f48}
  .btn.ghost{background:rgba(255,255,255,.14);color:#fff}
  .btn.ghost:hover{background:rgba(255,255,255,.24)}
  .menu{position:relative}
  .menu .dd{position:absolute;right:0;top:calc(100% + 6px);background:#fff;color:var(--ui-ink);border-radius:12px;box-shadow:0 12px 36px rgba(40,0,25,.28);padding:6px;min-width:270px;display:none;z-index:50}
  .menu.open .dd{display:block}
  .dd button{display:flex;width:100%;text-align:left;border:0;background:none;padding:9px 11px;border-radius:8px;cursor:pointer}
  .dd button:hover{background:var(--rosepale)}
  .dd button small{display:block;color:var(--ui-muted);font-size:11.5px}
  .dd hr{border:0;border-top:1px solid var(--ui-line);margin:4px 6px}

  .app{flex:1;display:grid;grid-template-columns:minmax(380px,520px) 1fr;min-height:0}
  .form{overflow:auto;padding:18px 18px 60px;border-right:1px solid var(--ui-line)}
  .preview{overflow:auto;background:#3a3036;padding:26px 20px 60px}
  .tabs{display:none}
  .card{background:var(--ui-card);border:1px solid var(--ui-line);border-radius:14px;padding:14px;margin-bottom:12px}
  .card h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#9b3e69;margin-bottom:10px;font-weight:700;display:flex;align-items:center;gap:8px}
  .card h2 .st{margin-left:auto;font-size:10.5px;letter-spacing:.08em;background:#f1edf0;color:#7d5a6e;border-radius:999px;padding:2px 9px}
  .card h2 .st.pub{background:#e3f4ea;color:#23764a}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  label.f{display:block;font-size:12px;color:var(--ui-muted);margin:10px 0 4px}
  label.f:first-of-type{margin-top:0}
  input[type=text],textarea,select{width:100%;border:1px solid var(--ui-line);border-radius:9px;padding:8px 10px;background:#fff;outline:none;font-size:14px}
  input:focus,textarea:focus,select:focus{border-color:#c8487f;box-shadow:0 0 0 3px rgba(200,72,127,.15)}
  textarea{resize:vertical;min-height:64px;line-height:1.4}
  .chk{display:flex;gap:8px;align-items:center;font-size:13.5px;cursor:pointer}
  .chk input{accent-color:#b0386c;width:16px;height:16px}
  .hint{font-size:11.5px;color:var(--ui-muted);margin-top:6px;line-height:1.4}
  .imp{background:#fffde0;border-color:#efe48a}
  .item .ih{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .item .ih .num{font-weight:800;color:#9b3e69;font-size:13px;width:22px}
  .item .ih select{flex:1}
  .mini{border:1px solid var(--ui-line);background:#fff;border-radius:8px;padding:5px 9px;font-size:12px;cursor:pointer;color:#6d3a55}
  .mini:hover{background:var(--rosepale)}
  .mini.danger{color:#a3263b}
  .add{width:100%;border:1.5px dashed #d9b3c5;background:#fdf7fa;color:#9b3e69;border-radius:12px;padding:11px;font-weight:700;cursor:pointer}
  .add:hover{background:var(--rosepale)}
  .pubcard{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-top:12px}
  .pubcard b{display:block;font-size:14px}
  .pubcard span{display:block;font-size:12px;color:var(--ui-muted);margin-top:2px}
  .pubbtn{background:#23764a;color:#fff}
  .robanner{background:#e3f4ea;border:1px solid #bfe3cd;border-radius:14px;padding:12px 14px;margin-bottom:12px;color:#1d5c3a}
  .robanner b{display:block}
  .robanner span{display:block;font-size:12px;margin-top:2px}
  .robanner .mini{margin-top:8px}
  body.ro .form .card:not(.robanner), body.ro .form .add{pointer-events:none;opacity:.6}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#2b1225;color:#fff;padding:11px 18px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:99}
  .toast.on{opacity:1;transform:translateX(-50%)}
  .pv-meta{color:#d9c6d0;font-size:12px;text-align:center;margin-bottom:14px}
  .pwrap{margin:0 auto 22px;box-shadow:0 10px 34px rgba(0,0,0,.45);position:relative}
  .pwrap > .page{transform-origin:0 0;position:absolute;left:0;top:0}

  /* Fenêtres (historique, images) */
  .modal{position:fixed;inset:0;background:rgba(30,6,20,.55);display:none;align-items:center;justify-content:center;z-index:80;padding:16px}
  .modal.on{display:flex}
  .mbox{background:#fff;border-radius:16px;width:min(860px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.35)}
  .mhead{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--ui-line)}
  .mhead h3{font-size:16px}
  .mclose{border:0;background:none;font-size:26px;line-height:1;cursor:pointer;color:var(--ui-muted)}
  .mbody{overflow:auto;padding:16px 18px;flex:1}
  .mfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 18px;border-top:1px solid var(--ui-line)}
  .mbtn{border:1px solid var(--ui-line);background:#fff;border-radius:9px;padding:9px 14px;font-weight:700;cursor:pointer}
  .mbtn.pri{background:#9b2f60;border-color:#9b2f60;color:#fff}
  .mintro{font-size:13.5px;color:#5d4252;line-height:1.45;margin-bottom:14px}
  .merr{background:#fff4ec;color:#9a3f17;border-radius:9px;padding:10px 12px;font-size:13px}
  .imgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .imgrid a{display:block;text-decoration:none;color:var(--ui-muted);font-size:12px;text-align:center}
  .imgrid img{width:100%;display:block;border-radius:8px;box-shadow:0 4px 14px rgba(40,0,25,.25);margin-bottom:6px}
  .htabs{display:flex;gap:6px;margin-bottom:12px}
  .htabs button{border:1px solid var(--ui-line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:700;cursor:pointer;color:#7d5a6e}
  .htabs button.on{background:#7a2a4e;border-color:#7a2a4e;color:#fff}
  .hrow{display:flex;align-items:center;gap:12px;border:1px solid var(--ui-line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
  .hrow.cur{border-color:#c8487f}
  .hrow .hi{flex:1;min-width:0}
  .hrow .hi b{display:block;font-size:14.5px}
  .hrow .hi span{display:block;font-size:12px;color:var(--ui-muted);margin-top:2px}
  .hrow .ha{display:flex;gap:6px;flex-wrap:wrap}
  .hempty{text-align:center;color:var(--ui-muted);padding:30px}

  .slide-card{border-left:4px solid #B33868}
  .slide-card .sh{display:flex;align-items:center;gap:6px;margin-bottom:6px}
  .slide-card .sh b{flex:1;font-size:13px;color:#9b3e69;letter-spacing:.08em;text-transform:uppercase}
  .blk-card{background:#faf6f8;border:1px solid var(--ui-line);border-radius:12px;padding:10px 12px;margin-top:10px}
  .blk-card .bh{display:flex;align-items:center;gap:6px;margin-bottom:4px}
  .blk-card .bh b{flex:1;font-size:12.5px;color:#7a2a4e}
  .addblk{display:flex;gap:6px;margin-top:10px}
  .addblk select{flex:1}
  .pictos{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
  .pictos button{width:44px;height:44px;border:1.5px solid var(--ui-line);border-radius:10px;background:#B33868 center/34px no-repeat;cursor:pointer;font-size:10px;color:#fff}
  .pictos button.on{border-color:#2b1225;box-shadow:0 0 0 2px rgba(179,56,104,.35)}
  .fmt{font-size:11px;color:var(--ui-muted);margin-top:4px;line-height:1.4}
  .fmt code{background:#f1e8ed;border-radius:4px;padding:0 4px;color:#7a2a4e}
  .seg2{display:flex;gap:6px;flex-wrap:wrap}
  .seg2 button{border:1px solid var(--ui-line);background:#fff;border-radius:999px;padding:6px 12px;font-weight:700;cursor:pointer;color:#7d5a6e;font-size:13px}
  .seg2 button.on{background:#7a2a4e;border-color:#7a2a4e;color:#fff}
  .sw{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}

  /* ===== LE VISUEL (1080 × 1080 / 1350 / 1920) ===== */
  .page{position:relative;overflow:hidden;color:#fff;font-family:"T1",Inter,system-ui,sans-serif;background:var(--bg);display:flex;flex-direction:column;
    -webkit-print-color-adjust:exact;print-color-adjust:exact;--k:1}
  .page .avion{position:absolute;left:0;top:170px;width:350px;pointer-events:none}
  .page .logo{position:absolute;right:120px;top:90px;width:190px}
  .page.logobas .logo{top:auto;bottom:70px;width:200px}
  .page .zone{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:var(--just,center);padding:var(--pt,420px) 140px var(--pb,110px) 160px;gap:calc(var(--k)*54px)}
  .page.sansavion .zone{--pt:300px}
  .page:not(.sansavion):not(.titre1) .zone{--pt:400px}
  .page.mesure .zone{justify-content:flex-start}
  .page.logobas .zone{--pb:70px}
  .page.logobas .sign{min-height:250px;display:flex;align-items:flex-end;padding-right:290px}
  .page.titre1 .zone{--pt:40px}
  .gt{position:relative;text-align:center;margin:0 -100px 0 -120px;overflow:hidden;padding-top:calc(var(--k)*26px)}
  .gt .g{position:absolute;left:0;right:0;top:0;font-size:calc(var(--k)*170px);font-weight:700;line-height:1;opacity:.18;letter-spacing:-.01em;white-space:nowrap}
  .gt h1{position:relative;margin:0;font-size:calc(var(--k)*118px);font-weight:700;line-height:1;letter-spacing:-.01em}
  .gt p{position:relative;margin:calc(var(--k)*14px) 0 0;font-size:calc(var(--k)*40px);font-weight:700}
  .acc{margin:0;font-size:calc(var(--k)*56px);font-style:italic;line-height:1.15}
  .acc.petit{font-size:calc(var(--k)*44px)}
  .acc sup{font-size:.55em}
  .fig{display:flex;align-items:center;gap:calc(var(--k)*44px);margin:0}
  .fig .t{font-size:calc(var(--k)*84px);line-height:1.08}
  .fig .t b{font-weight:700}
  .badge{flex:none;width:calc(var(--k)*160px);height:calc(var(--k)*160px);border-radius:50%;background:rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center}
  .badge span{width:84%;height:84%;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:calc(var(--k)*48px);letter-spacing:-.01em}
  .badge.vert span{background:#3E8C2A}.badge.rouge span{background:#D43B2E}.badge.blanc span{background:#fff;color:var(--bg)}
  .tx{margin:0;font-size:calc(var(--k)*46px);line-height:1.38}
  .tx.grand{font-size:calc(var(--k)*58px);line-height:1.3}
  .tx b,.acc b{font-weight:700}
  .lig{display:flex;align-items:center;gap:calc(var(--k)*60px)}
  .lig img{width:calc(var(--k)*270px);flex:none}
  .lig .tx{flex:1}
  .carte{background:#fff;color:#2B2B30;border-radius:calc(var(--k)*38px);padding:calc(var(--k)*50px) calc(var(--k)*60px);display:flex;gap:calc(var(--k)*40px);box-shadow:0 18px 40px rgba(40,0,20,.18);margin:0 -40px 0 -60px}
  .carte .it{flex:1;display:flex;align-items:center;gap:calc(var(--k)*34px)}
  .carte img{width:calc(var(--k)*150px);flex:none}
  .carte p{margin:0;font-size:calc(var(--k)*44px);line-height:1.25}
  .carte b{font-weight:700}
  .concl{margin:0 -140px 0 -160px;background:#EBEBEB;color:var(--bg);padding:calc(var(--k)*76px) 140px calc(var(--k)*76px) 160px}
  .concl p{margin:0;font-size:calc(var(--k)*56px);line-height:1.38;font-weight:700}
  .sign{margin:0;font-size:calc(var(--k)*52px);font-weight:700;padding-right:300px}
  .esp{height:calc(var(--k)*40px)}

  .pwrap{margin:0 auto 22px}
  @media screen and (max-width:900px){
    .top{flex-wrap:wrap;gap:10px;padding:10px 12px}
    .top h1{font-size:14px}
    .top .sp{display:none}
    .acts{width:100%;justify-content:space-between}
    .top .lg{display:none}
    .top .btn{padding:9px 12px}
    .app{grid-template-columns:1fr}
    .tabs{display:flex;background:#fff;border-bottom:1px solid var(--ui-line);flex:none}
    .tabs button{flex:1;border:0;background:none;padding:11px;font-weight:700;color:var(--ui-muted);border-bottom:3px solid transparent}
    .tabs button.on{color:#8a2b57;border-color:#b0386c}
    body.tab-apercu .form{display:none}
    body:not(.tab-apercu) .preview{display:none}
    .form{border-right:0;padding:12px 12px 80px}
  }
</style>
</head>
<body>
<div class="top">
  <a href="../" class="home" title="Retour à l'Atelier UNAC"><img class="logo" src="../commun/img/logo-unac-blanc.png" alt="Atelier UNAC"></a>
  <h1>Chrono’<small>Posts Facebook et Instagram — mise en page automatique</small></h1>
  <div class="sp"></div>
  <div class="acts">
    <button class="btn ghost" id="histBtn" title="Posts publiés et brouillons"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v5l3 2"/><circle cx="12" cy="12" r="9"/></svg><span class="lg">Historique</span></button>
    <button class="btn ghost" id="resetBtn" title="Nouveau post vierge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg><span class="lg">Recommencer</span></button>
    <div class="menu" id="menu">
      <button class="btn ghost" id="menuBtn"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg><span class="lg">Brouillon</span></button>
      <div class="dd">
        <button id="aPublish"><div>Publier ce post<small>Il passe dans « Publiés » et n'est plus modifiable.</small></div></button>
        <hr>
        <button id="aShare"><div>Copier le lien de partage<small>Le brouillon est contenu dans le lien.</small></div></button>
        <button id="aSave"><div>Enregistrer le brouillon (.json)</div></button>
        <button id="aOpen"><div>Ouvrir un brouillon (.json)</div></button>
        <hr>
        <button data-modele="chiffres"><div>Modèle « chiffres clés »<small>Résultats T3, pastilles, bandeau de conclusion.</small></div></button>
        <button data-modele="victoire"><div>Modèle « victoire UNAC »<small>Grand titre, pictos, carte blanche, signature.</small></div></button>
      </div>
    </div>
    <button class="btn pdf" id="imgBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg><span class="lg">Télécharger les&nbsp;</span>images</button>
  </div>
</div>
<div class="tabs" id="tabs"><button data-tab="saisie" class="on">Saisie</button><button data-tab="apercu">Aperçu</button></div>
<div class="app">
  <div class="form" id="form"></div>
  <div class="preview" id="preview"><div class="pv-meta" id="pvMeta"></div><div id="pages"></div></div>
</div>
<input type="file" id="fileJson" accept="application/json,.json" hidden>
<div class="toast" id="toast"></div>

<div class="modal" id="histModal"><div class="mbox" role="dialog" aria-modal="true">
  <div class="mhead"><h3>Historique des posts</h3><button class="mclose" data-x aria-label="Fermer">×</button></div>
  <div class="mbody" id="hBody"></div>
  <div class="mfoot"><button class="mbtn" id="hNew">+ Nouveau post</button><button class="mbtn pri" data-x>Fermer</button></div>
</div></div>

<script>
const MODELES = {
  chiffres: {nom:"Résultats T3 · MNL", format:"portrait", theme:"prune", avion:true, logo:"haut", slides:[{blocs:[
    {type:"accroche", texte:"Au 3^e trimestre,", taille:"grand"},
    {type:"chiffre", libelle:"Recettes à", valeur:"6 Milliards €", badge:"+5%", couleur:"vert"},
    {type:"chiffre", libelle:"Résultat à", valeur:"811 Millions €", badge:"+5%", couleur:"vert"},
    {type:"accroche", texte:"Ceci étant,", taille:"petit"},
    {type:"texte", texte:"Signer des dérogations pour **réduire le temps d’escale des PNC sur MNL** semble toujours vital au **tandem Direction/UNPNC,** sous couvert d’une ligne dite **« économiquement fragile ».**", taille:"normal"},
    {type:"conclusion", texte:"Nous laissons les PNC apprécier cette étrange rhétorique qui voudrait faire de leurs larges concessions, la condition même de la survie économique d’Air France."}]}]},
  victoire: {nom:"MCPT4 · victoire UNAC", format:"carre", theme:"framboise", avion:false, logo:"bas", slides:[{blocs:[
    {type:"titre", titre:"MCPT4", sous:"Belle victoire de l’UNAC pour tous les PNC"},
    {type:"texte", texte:"L’**UNAC** obtient suite au courrier envoyé à la Direction le 12 janvier pour tous les PNC l'évolution de la procédure MCPT4 : **vous n’avez plus besoin de monter au terrain.**", taille:"normal"},
    {type:"picto", picto:"refus-vol", texte:"Si vous refusez un vol,\n**vous n'avez plus à monter au terrain pointer**"},
    {type:"picto", picto:"telephone", texte:"Désormais, vous pouvez **appeler** le cadre de permanence pour activer le MCPT4 **jusqu’à J-2 18h**"},
    {type:"carte", p1:"calendrier", t1:"**Pas de déstabilisation**\ndu planning", p2:"pieces", t2:"**Pas de retrait**\nde trentième"},
    {type:"signature", texte:"Tous les jours, l’UNAC défend les PNC"}]}]}
};

"use strict";
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2,9);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const riche = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\^(\w+)/g, "<sup>$1</sup>").replace(/\n/g, "<br>");
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("on"), 2600); }
const IMG = "../commun/img/";
const FORMATS = {carre:{nom:"Carré 1:1", w:1080, h:1080}, portrait:{nom:"Portrait 4:5", w:1080, h:1350}, story:{nom:"Story 9:16", w:1080, h:1920}};
const THEMES = {prune:{nom:"Prune", bg:"#A54067"}, framboise:{nom:"Framboise", bg:"#CF3473"}, bordeaux:{nom:"Bordeaux", bg:"#6E1F44"}};
const PICTOS = {"refus-vol":"Refus de vol", telephone:"Téléphone", calendrier:"Planning", pieces:"Rémunération", appli:"Appli", factures:"Documents", lit:"Repos / lit", etranger:"Étranger", fonds:"Santé / fonds", reclamation:"Réclamation", elus:"Élu.es"};
const AIDE = "<code>**gras**</code> · <code>3^e</code> pour l'exposant · retour à la ligne conservé";

const TYPES = {
  titre:   {nom:"Grand titre (avec écho)", champs:[["titre","Titre","text"],["sous","Sous-titre","text"]]},
  accroche:{nom:"Accroche en italique", champs:[["texte","Texte","area"],["taille","Taille","select",{grand:"Grande",petit:"Moyenne"}]]},
  chiffre: {nom:"Chiffre clé + pastille", champs:[["libelle","Libellé","text","Recettes à"],["valeur","Valeur en gras","text"],["badge","Pastille (ex. +5%, vide = aucune)","text"],["couleur","Couleur de la pastille","select",{vert:"Vert (hausse)",rouge:"Rouge (baisse)",blanc:"Blanche"}]]},
  texte:   {nom:"Texte", champs:[["texte","Texte","area"],["taille","Taille","select",{normal:"Normale",grand:"Grande"}]]},
  picto:   {nom:"Picto + texte", champs:[["picto","Picto","picto"],["texte","Texte","area"]]},
  carte:   {nom:"Carte blanche (2 points)", champs:[["p1","Point 1 : picto","picto"],["t1","Point 1 : texte","area"],["p2","Point 2 : picto","picto"],["t2","Point 2 : texte","area"]]},
  conclusion:{nom:"Bandeau de conclusion (gris)", champs:[["texte","Texte","area"]]},
  signature:{nom:"Signature en bas", champs:[["texte","Texte","text","Tous les jours, l'UNAC défend les PNC"]]},
  espace:  {nom:"Espace", champs:[]}
};
function blocHTML(b){
  switch(b.type){
    case "titre": return `<div class="gt"><div class="g" aria-hidden="true">${esc(b.titre)}</div><h1>${esc(b.titre)}</h1>${b.sous ? `<p>${riche(b.sous)}</p>` : ""}</div>`;
    case "accroche": return `<p class="acc ${b.taille === "petit" ? "petit" : ""}">${riche(b.texte)}</p>`;
    case "chiffre": return `<div class="fig"><div class="t">${riche(b.libelle)} <b>${riche(b.valeur)}</b></div>${b.badge ? `<div class="badge ${esc(b.couleur||"vert")}"><span>${esc(b.badge)}</span></div>` : ""}</div>`;
    case "texte": return `<p class="tx ${b.taille === "grand" ? "grand" : ""}">${riche(b.texte)}</p>`;
    case "picto": return `<div class="lig">${b.picto ? `<img src="${IMG}pictos/${b.picto}.png" alt="">` : ""}<p class="tx">${riche(b.texte)}</p></div>`;
    case "carte": return `<div class="carte">${[[b.p1,b.t1],[b.p2,b.t2]].filter(([p,t]) => p || (t||"").trim()).map(([p,t]) => `<div class="it">${p ? `<img src="${IMG}pictos/${p}.png" alt="">` : ""}<p>${riche(t)}</p></div>`).join("")}</div>`;
    case "conclusion": return `<div class="concl"><p>${riche(b.texte)}</p></div>`;
    case "signature": return `<p class="sign">${riche(b.texte)}</p>`;
    case "espace": return `<div class="esp"></div>`;
  }
  return "";
}
const blocVide = b => b.type !== "espace" && !TYPES[b.type].champs.some(([k,,ty]) => (ty === "text" || ty === "area" || ty === "picto") && String(b[k]||"").trim());

/* ---------- État ---------- */
const DOCS_KEY = "chrono:docs", CUR_KEY = "chrono:current";
let DOCS = {}, S = null;
function nouveauBloc(type){ const b = {id:uid(), type}; TYPES[type].champs.forEach(([k,,ty,def]) => { b[k] = ty === "select" ? Object.keys(def)[0] : (typeof def === "string" ? def : ""); }); return b; }
function nouvelleSlide(){ return {id:uid(), blocs:[nouveauBloc("accroche"), nouveauBloc("texte")]}; }
function blank(){ return {v:1, id:uid(), statut:"brouillon", cree:Date.now(), maj:Date.now(), nom:"", format:"carre", theme:"prune", avion:true, logo:"haut", slides:[nouvelleSlide()]}; }
function hasContent(d){ return d.slides.some(s => s.blocs.some(b => !blocVide(b))); }
function persist(){ try{ localStorage.setItem(DOCS_KEY, JSON.stringify(DOCS)); localStorage.setItem(CUR_KEY, S.id); }catch(e){ toast("Mémoire de l'appareil pleine"); } }
let saveT = null;
function save(){ if(S.statut === "publie") return; S.maj = Date.now(); DOCS[S.id] = S; clearTimeout(saveT); saveT = setTimeout(persist, 300); }
function changed(structural){ save(); if(structural) renderForm(); schedulePreview(); }
function openDoc(d){ if(S && S !== d && S.statut === "brouillon" && !hasContent(S)) delete DOCS[S.id]; S = d; DOCS[d.id] = d; persist(); document.body.classList.toggle("ro", S.statut === "publie"); renderForm(); renderPreview(); }
function latestDraft(){ return Object.values(DOCS).filter(d => d.statut === "brouillon").sort((a,b) => b.maj - a.maj)[0]; }
function copyToDraft(d){ const c = JSON.parse(JSON.stringify(d)); Object.assign(c, {id:uid(), statut:"brouillon", cree:Date.now(), maj:Date.now()}); delete c.publieLe; openDoc(c); toast("Brouillon créé à partir de ce post"); }
const nomPost = d => d.nom || (d.slides[0].blocs.map(b => b.titre || b.valeur || b.texte || "").find(x => x.trim()) || "Post sans titre").replace(/\*\*/g,"").replace(/\n/g," ").slice(0, 60);

/* ---------- Formulaire ---------- */
function champ(b, [k, lab, ty, def]){
  const v = b[k] ?? "";
  if(ty === "area") return `<label class="f">${lab}</label><textarea data-b="${k}" rows="${Math.min(8, Math.max(2, String(v).split("\n").length + 1))}">${esc(v)}</textarea>`;
  if(ty === "select") return `<label class="f">${lab}</label><select data-b="${k}">${Object.entries(def).map(([o,l]) => `<option value="${o}" ${o===v?"selected":""}>${l}</option>`).join("")}</select>`;
  if(ty === "picto") return `<label class="f">${lab}</label><div class="pictos"><button data-pk="${k}" data-pv="" class="${!v?"on":""}">aucun</button>${Object.entries(PICTOS).map(([p,l]) => `<button data-pk="${k}" data-pv="${p}" title="${l}" class="${v===p?"on":""}" style="background-image:url(${IMG}pictos/${p}.png)"></button>`).join("")}</div>`;
  return `<label class="f">${lab}</label><input type="text" data-b="${k}" value="${esc(v)}">`;
}
function renderForm(){
  const f = $("#form"), sc = f.scrollTop, ro = S.statut === "publie";
  const dt = ts => new Date(ts).toLocaleDateString("fr-FR");
  let h = ro ? `<div class="card robanner"><b>Post publié le ${dt(S.publieLe||S.maj)}</b><span>Consultation seule.</span><button class="mini" id="roCopy">Créer un brouillon à partir de celui-ci</button></div>` : "";
  h += `<div class="card"><h2>Réglages <span class="st ${ro?"pub":""}">${ro?"Publié":"Brouillon"}</span></h2>
    <label class="f">Nom du post (pour l'historique)</label><input type="text" data-k="nom" value="${esc(S.nom)}" placeholder="ex. Résultats T3 / MNL">
    <label class="f">Format</label><div class="seg2">${Object.entries(FORMATS).map(([k,o]) => `<button data-set="format" data-v="${k}" class="${S.format===k?"on":""}">${o.nom}</button>`).join("")}</div>
    <label class="f">Couleur de fond</label><div class="seg2">${Object.entries(THEMES).map(([k,o]) => `<button data-set="theme" data-v="${k}" class="${S.theme===k?"on":""}"><span class="sw" style="background:${o.bg}"></span>${o.nom}</button>`).join("")}</div>
    <label class="f">Logo UNAC</label><div class="seg2"><button data-set="logo" data-v="haut" class="${S.logo==="haut"?"on":""}">En haut à droite</button><button data-set="logo" data-v="bas" class="${S.logo==="bas"?"on":""}">En bas à droite</button></div>
    <label class="chk" style="margin-top:10px"><input type="checkbox" data-k="avion" ${S.avion?"checked":""}> Nez d'avion en haut à gauche</label></div>`;
  S.slides.forEach((s, si) => {
    h += `<div class="card slide-card" data-s="${s.id}"><div class="sh"><b>${S.slides.length > 1 ? `Visuel ${si+1} / ${S.slides.length}` : "Contenu du visuel"}</b>${si>0?`<button class="mini" data-a="sup">↑</button>`:""}${si<S.slides.length-1?`<button class="mini" data-a="sdown">↓</button>`:""}${S.slides.length>1?`<button class="mini danger" data-a="sdel">Supprimer</button>`:""}</div>`;
    s.blocs.forEach((b, bi) => {
      const T = TYPES[b.type];
      h += `<div class="blk-card" data-b-id="${b.id}"><div class="bh"><b>${T.nom}</b>${bi>0?`<button class="mini" data-a="bup">↑</button>`:""}${bi<s.blocs.length-1?`<button class="mini" data-a="bdown">↓</button>`:""}<button class="mini danger" data-a="bdel">✕</button></div>
        ${T.champs.map(c => champ(b, c)).join("")}${T.champs.some(c => c[2] === "area") ? `<p class="fmt">${AIDE}</p>` : ""}</div>`;
    });
    h += `<div class="addblk"><select>${Object.entries(TYPES).map(([k,t]) => `<option value="${k}">${t.nom}</option>`).join("")}</select><button class="mini" data-a="badd">+ Ajouter ce bloc</button></div></div>`;
  });
  h += `<button class="add" id="addSlide">+ Ajouter un visuel (carrousel)</button>
    <p class="hint" style="margin:10px 4px 0">La taille du texte s'ajuste toute seule pour remplir le visuel sans déborder.</p>
    ${ro ? "" : `<div class="card pubcard"><div><b>Post terminé ?</b><span>Publiez-le : il passe dans l'historique et n'est plus modifiable.</span></div><button class="btn pubbtn" id="pubBtn">Publier</button></div>`}`;
  f.innerHTML = h; f.scrollTop = sc;
}
const slideOf = el => S.slides.find(s => s.id === el.closest("[data-s]").dataset.s);
const blocOf = el => slideOf(el).blocs.find(x => x.id === el.closest("[data-b-id]").dataset.bId);
$("#form").addEventListener("input", e => {
  const t = e.target, v = t.type === "checkbox" ? t.checked : t.value;
  if(t.dataset.k){ S[t.dataset.k] = v; return changed(false); }
  if(t.dataset.b){ blocOf(t)[t.dataset.b] = v; return changed(false); }
});
$("#form").addEventListener("click", e => {
  if(e.target.id === "addSlide"){ S.slides.push(nouvelleSlide()); changed(true); const f = $("#form"); f.scrollTop = f.scrollHeight; return; }
  if(e.target.id === "pubBtn") return publier();
  if(e.target.id === "roCopy") return copyToDraft(S);
  const st = e.target.closest("[data-set]"); if(st){ S[st.dataset.set] = st.dataset.v; return changed(true); }
  const pk = e.target.closest("[data-pk]"); if(pk){ blocOf(pk)[pk.dataset.pk] = pk.dataset.pv; return changed(true); }
  const b = e.target.closest("[data-a]"); if(!b) return;
  const s = slideOf(b), si = S.slides.indexOf(s), a = b.dataset.a;
  if(a === "sdel"){ if(!confirm("Supprimer ce visuel ?")) return; S.slides.splice(si,1); }
  if(a === "sup") [S.slides[si-1], S.slides[si]] = [S.slides[si], S.slides[si-1]];
  if(a === "sdown") [S.slides[si+1], S.slides[si]] = [S.slides[si], S.slides[si+1]];
  if(a === "badd") s.blocs.push(nouveauBloc(b.closest(".addblk").querySelector("select").value));
  if(["bup","bdown","bdel"].includes(a)){
    const bi = s.blocs.findIndex(x => x.id === b.closest("[data-b-id]").dataset.bId);
    if(a === "bdel"){ if(!blocVide(s.blocs[bi]) && !confirm("Supprimer ce bloc ?")) return; s.blocs.splice(bi,1); }
    if(a === "bup") [s.blocs[bi-1], s.blocs[bi]] = [s.blocs[bi], s.blocs[bi-1]];
    if(a === "bdown") [s.blocs[bi+1], s.blocs[bi]] = [s.blocs[bi], s.blocs[bi+1]];
  }
  changed(true);
});

/* ---------- Rendu ---------- */
function el(html){ const d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstChild; }
function slideNode(s){
  const F = FORMATS[S.format], T = THEMES[S.theme];
  const blocs = s.blocs.filter(b => !blocVide(b));
  const w = document.createElement("div"); w.className = "pwrap";
  const p = document.createElement("section");
  const titreEnTete = blocs[0] && blocs[0].type === "titre";
  const finConcl = blocs.length && blocs[blocs.length-1].type === "conclusion";
  p.className = "page" + (S.avion && !titreEnTete ? "" : " sansavion") + (titreEnTete ? " titre1" : "") + (S.logo === "bas" ? " logobas" : "");
  p.style.cssText = `width:${F.w}px;height:${F.h}px;--bg:${T.bg}` + (finConcl ? ";--pb:110px" : "") + (titreEnTete ? ";--just:space-between" : "");
  p.innerHTML = (S.avion && !titreEnTete ? `<img class="avion" src="${IMG}avion-nez.png" alt="">` : "") + `<img class="logo" src="${IMG}logo-unac-blanc.png" alt="UNAC">`
    + `<div class="zone">${blocs.map(blocHTML).join("")}</div>`;
  w.appendChild(p); return w;
}
function ajuste(p){
  const z = p.querySelector(".zone");
  // mesure en haut de zone : un contenu centré qui déborde ne serait pas compté par scrollHeight
  p.classList.add("mesure");
  // marge de sécurité : le rendu en image peut faire passer une ligne de plus
  const fits = () => {
    const last = z.lastElementChild; if(!last) return true;
    const zr = z.getBoundingClientRect(), lr = last.getBoundingClientRect();
    const pb = parseFloat(getComputedStyle(z).paddingBottom) || 0;
    return (lr.bottom - zr.top) + pb <= zr.height - 24;
  };
  let lo = 0.45, hi = 1.25;
  p.style.setProperty("--k", hi); if(fits()){ p.classList.remove("mesure"); return hi; }
  for(let i=0;i<14;i++){ const m = (lo+hi)/2; p.style.setProperty("--k", m); if(fits()) lo = m; else hi = m; }
  p.style.setProperty("--k", lo); p.classList.remove("mesure"); return lo;
}
let pvT = null;
function schedulePreview(){ clearTimeout(pvT); pvT = setTimeout(renderPreview, 250); }
function renderPreview(){
  const stage = document.createElement("div"); stage.style.cssText = "position:fixed;left:-30000px;top:0;visibility:hidden"; document.body.appendChild(stage);
  S.slides.forEach(s => { const w = slideNode(s); stage.appendChild(w); ajuste(w.firstChild); });
  const box = $("#pages"); box.innerHTML = ""; while(stage.firstChild) box.appendChild(stage.firstChild); stage.remove();
  // une image pas encore chargée a une hauteur nulle : on réajuste son visuel dès qu'elle arrive
  box.querySelectorAll(".page").forEach(pg => pg.querySelectorAll("img").forEach(im => { if(!im.complete) im.addEventListener("load", () => ajuste(pg), {once:true}); }));
  fitPreview();
  const F = FORMATS[S.format];
  $("#pvMeta").textContent = `${S.slides.length} visuel${S.slides.length>1?"s":""} · ${F.nom} (${F.w} × ${F.h})`;
}
function fitPreview(){
  const F = FORMATS[S.format], pv = $("#preview");
  const k = Math.min(pv.clientWidth - 40, 640, F.w) / F.w;
  document.querySelectorAll(".pwrap").forEach(w => { w.style.width = (F.w*k)+"px"; w.style.height = (F.h*k)+"px"; w.firstChild.style.transform = `scale(${k})`; });
}
window.addEventListener("resize", fitPreview);
window.EXPORT_LARGEUR = 1080;

let tab = "saisie";
function syncTab(){ document.body.classList.toggle("tab-apercu", tab === "apercu"); document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab)); if(tab === "apercu") renderPreview(); }
$("#tabs").addEventListener("click", e => { const b = e.target.closest("button"); if(b){ tab = b.dataset.tab; syncTab(); } });
window.nomExport = () => ("Chrono-" + nomPost(S)).replace(/[^\wÀ-ÿ-]+/g, "-").replace(/-+/g, "-").replace(/-$/, "");
window.titreExport = () => nomPost(S);
$("#imgBtn").addEventListener("click", () => exportImages());

/* ---------- Publication, historique ---------- */
function publier(){
  if(S.statut === "publie") return;
  if(!hasContent(S)) return toast("Rien à publier");
  if(!confirm(`Publier le post « ${nomPost(S)} » ?\n\nIl passera dans « Publiés » et ne sera plus modifiable (vous pourrez en faire un nouveau brouillon).`)) return;
  S.statut = "publie"; S.publieLe = Date.now(); DOCS[S.id] = S; persist(); openDoc(S); toast("Post publié");
}
$("#resetBtn").addEventListener("click", () => {
  if(S.statut === "brouillon" && hasContent(S) && !confirm("Recommencer à zéro ?\n\nUn nouveau post vierge est créé. Le brouillon actuel reste disponible dans « Historique ».")) return;
  openDoc(blank()); toast("Nouveau post vierge");
});
const HM = $("#histModal"); let onglet = "brouillons";
HM.addEventListener("click", e => { if(e.target === HM || e.target.hasAttribute("data-x")) HM.classList.remove("on"); });
$("#hNew").addEventListener("click", () => { HM.classList.remove("on"); openDoc(blank()); });
$("#histBtn").addEventListener("click", () => { persist(); onglet = S.statut === "publie" ? "publies" : "brouillons"; renderHist(); HM.classList.add("on"); });
function renderHist(){
  const all = Object.values(DOCS).filter(d => hasContent(d) || d.id === S.id);
  const br = all.filter(d => d.statut === "brouillon").sort((a,b) => b.maj - a.maj), pu = all.filter(d => d.statut === "publie").sort((a,b) => b.publieLe - a.publieLe);
  const list = onglet === "brouillons" ? br : pu;
  const dt = ts => new Date(ts).toLocaleDateString("fr-FR") + " à " + new Date(ts).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
  $("#hBody").innerHTML = `<div class="htabs"><button data-t="brouillons" class="${onglet==="brouillons"?"on":""}">Brouillons (${br.length})</button><button data-t="publies" class="${onglet==="publies"?"on":""}">Publiés (${pu.length})</button></div>`
    + (list.length ? list.map(d => `<div class="hrow ${d.id===S.id?"cur":""}" data-id="${d.id}"><div class="hi"><b>${esc(nomPost(d))}</b><span>${FORMATS[d.format].nom} · ${d.slides.length} visuel(s) · ${d.statut === "publie" ? "publié le " + dt(d.publieLe) : "modifié le " + dt(d.maj)}${d.id===S.id?" · ouvert":""}</span></div>
      <div class="ha">${d.id===S.id?"":`<button class="mini" data-h="open">${d.statut==="publie"?"Consulter":"Ouvrir"}</button>`}<button class="mini" data-h="dup">${d.statut==="publie"?"Nouveau brouillon":"Dupliquer"}</button><button class="mini danger" data-h="del">Supprimer</button></div></div>`).join("")
      : `<div class="hempty">${onglet === "brouillons" ? "Aucun brouillon." : "Aucun post publié pour le moment."}</div>`);
}
$("#hBody").addEventListener("click", e => {
  const t = e.target.closest("[data-t]"); if(t){ onglet = t.dataset.t; return renderHist(); }
  const b = e.target.closest("[data-h]"); if(!b) return;
  const d = DOCS[b.closest(".hrow").dataset.id];
  if(b.dataset.h === "open"){ HM.classList.remove("on"); return openDoc(d); }
  if(b.dataset.h === "dup"){ HM.classList.remove("on"); return copyToDraft(d); }
  if(b.dataset.h === "del"){ if(!confirm(`Supprimer définitivement « ${nomPost(d)} » de cet appareil ?`)) return; delete DOCS[d.id]; if(S.id === d.id){ S = latestDraft() || blank(); DOCS[S.id] = S; openDoc(S); } persist(); renderHist(); }
});

/* ---------- Brouillon : partage / fichier / modèles ---------- */
const menu = $("#menu");
$("#menuBtn").addEventListener("click", e => { e.stopPropagation(); menu.classList.toggle("open"); });
document.addEventListener("click", e => { if(!menu.contains(e.target)) menu.classList.remove("open"); });
const exportable = () => { const o = JSON.parse(JSON.stringify(S)); ["id","statut","cree","maj","publieLe"].forEach(k => delete o[k]); return o; };
async function deflate(str){ const cs = new Blob([new TextEncoder().encode(str)]).stream().pipeThrough(new CompressionStream("deflate-raw")); const buf = new Uint8Array(await new Response(cs).arrayBuffer()); let s = ""; buf.forEach(x => s += String.fromCharCode(x)); return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
async function inflate(s){ let b = s.replace(/-/g,"+").replace(/_/g,"/"); while(b.length % 4) b += "="; const ds = new Blob([Uint8Array.from(atob(b), c => c.charCodeAt(0))]).stream().pipeThrough(new DecompressionStream("deflate-raw")); return await new Response(ds).text(); }
function recevoir(o, msg){
  if(!o || !Array.isArray(o.slides)) return toast("Brouillon non reconnu");
  const d = Object.assign(blank(), JSON.parse(JSON.stringify(o)), {id:uid(), statut:"brouillon", cree:Date.now(), maj:Date.now()});
  d.slides.forEach(s => { s.id = uid(); s.blocs.forEach(b => b.id = uid()); }); openDoc(d); toast(msg || "Post ouvert dans un nouveau brouillon");
}
$("#aPublish").addEventListener("click", () => { menu.classList.remove("open"); publier(); });
$("#aShare").addEventListener("click", async () => { menu.classList.remove("open"); const url = location.origin + location.pathname + "#d=" + await deflate(JSON.stringify(exportable())); try{ await navigator.clipboard.writeText(url); toast("Lien copié : à coller dans un message"); }catch(e){ prompt("Copiez ce lien :", url); } });
$("#aSave").addEventListener("click", () => { menu.classList.remove("open"); const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(exportable(), null, 1)], {type:"application/json"})); a.download = window.nomExport() + ".json"; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); });
$("#aOpen").addEventListener("click", () => { menu.classList.remove("open"); $("#fileJson").click(); });
$("#fileJson").addEventListener("change", async e => { const f = e.target.files[0]; e.target.value = ""; if(!f) return; try{ recevoir(JSON.parse(await f.text())); }catch(err){ toast("Fichier illisible"); } });
document.querySelectorAll("[data-modele]").forEach(b => b.addEventListener("click", () => { menu.classList.remove("open"); recevoir(MODELES[b.dataset.modele], "Modèle ouvert dans un nouveau brouillon"); }));

/* ---------- Démarrage ---------- */
(async function(){
  try{ DOCS = JSON.parse(localStorage.getItem(DOCS_KEY) || "{}") || {}; }catch(e){ DOCS = {}; }
  S = DOCS[localStorage.getItem(CUR_KEY)] || latestDraft() || null;
  if(!S){ S = Object.assign(blank(), JSON.parse(JSON.stringify(MODELES.chiffres))); S.slides.forEach(s => { s.id = uid(); s.blocs.forEach(b => b.id = uid()); }); }
  DOCS[S.id] = S;
  document.body.classList.toggle("ro", S.statut === "publie");
  renderForm(); if(document.fonts) await document.fonts.ready; renderPreview();
  if(location.hash.startsWith("#d=")){ try{ const o = JSON.parse(await inflate(location.hash.slice(3))); history.replaceState(null, "", location.pathname); recevoir(o); }catch(e){ toast("Lien de brouillon illisible"); } }
  window.addEventListener("load", renderPreview);
})();

</script>
<script src="../commun/export-images.js"></script>
</body>
</html>
