<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Newsletter · Atelier UNAC</title>
<link rel="icon" href="../commun/icons-atelier/favicon.png">
<link rel="apple-touch-icon" href="../commun/icons-atelier/apple-touch-icon.png">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Atelier UNAC">
<meta name="theme-color" content="#5b1a3a">
<meta name="robots" content="noindex, nofollow">
<script src="../commun/acces.js"></script>
<style>
  @font-face{font-family:"T1";src:url("../commun/polices/x1.woff2") format("woff2");font-weight:400;font-display:block}
  @font-face{font-family:"T1";src:url("../commun/polices/x2.woff2") format("woff2");font-weight:700 800;font-display:block}
  :root{--mag:#C2286A;--mag2:#A01A55;--rosepale:#FBE4EC;--ui-bg:#f6f1f4;--ui-card:#fff;--ui-line:#e7dbe2;--ui-ink:#2b1225;--ui-muted:#8b6f80}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"T1",Inter,system-ui,-apple-system,sans-serif;background:var(--ui-bg);color:var(--ui-ink);display:flex;flex-direction:column}
  button,input,textarea,select{font:inherit;color:inherit}

  /* Barre du haut */
  .top{display:flex;align-items:center;gap:14px;padding:10px 18px;background:linear-gradient(100deg,#7a2a4e 0%,#5e1d3c 60%,#4f1530 100%);color:#fff;flex:none}
  .top a.home{display:block}
  .top img.logo{height:34px;display:block}
  .top h1{font-size:16px;font-weight:700;letter-spacing:.02em;line-height:1.15}
  .top h1 small{display:block;font-weight:400;font-size:11.5px;opacity:.75}
  .top .sp{flex:1}
  .acts{display:flex;gap:8px;align-items:center}
  .btn{border:0;border-radius:9px;padding:9px 14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
  .btn svg{width:16px;height:16px;flex:none}
  .btn.pdf{background:#fff;color:#7a1f48}
  .btn.ghost{background:rgba(255,255,255,.14);color:#fff}
  .btn.ghost:hover{background:rgba(255,255,255,.24)}
  .menu{position:relative}
  .menu .dd{position:absolute;right:0;top:calc(100% + 6px);background:#fff;color:var(--ui-ink);border-radius:12px;box-shadow:0 12px 36px rgba(40,0,25,.28);padding:6px;min-width:270px;display:none;z-index:50}
  .menu.open .dd{display:block}
  .dd button{display:flex;width:100%;text-align:left;border:0;background:none;padding:9px 11px;border-radius:8px;cursor:pointer}
  .dd button:hover{background:var(--rosepale)}
  .dd button small{display:block;color:var(--ui-muted);font-size:11.5px}
  .dd hr{border:0;border-top:1px solid var(--ui-line);margin:4px 6px}

  .app{flex:1;display:grid;grid-template-columns:minmax(380px,520px) 1fr;min-height:0}
  .form{overflow:auto;padding:18px 18px 60px;border-right:1px solid var(--ui-line)}
  .preview{overflow:auto;background:#3a3036;padding:26px 20px 60px}
  .tabs{display:none}
  .card{background:var(--ui-card);border:1px solid var(--ui-line);border-radius:14px;padding:14px;margin-bottom:12px}
  .card h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#9b3e69;margin-bottom:10px;font-weight:700;display:flex;align-items:center;gap:8px}
  .card h2 .st{margin-left:auto;font-size:10.5px;letter-spacing:.08em;background:#f1edf0;color:#7d5a6e;border-radius:999px;padding:2px 9px}
  .card h2 .st.pub{background:#e3f4ea;color:#23764a}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  label.f{display:block;font-size:12px;color:var(--ui-muted);margin:10px 0 4px}
  label.f:first-of-type{margin-top:0}
  input[type=text],textarea,select{width:100%;border:1px solid var(--ui-line);border-radius:9px;padding:8px 10px;background:#fff;outline:none;font-size:14px}
  input:focus,textarea:focus,select:focus{border-color:#c8487f;box-shadow:0 0 0 3px rgba(200,72,127,.15)}
  textarea{resize:vertical;min-height:64px;line-height:1.4}
  .chk{display:flex;gap:8px;align-items:center;font-size:13.5px;cursor:pointer}
  .chk input{accent-color:#b0386c;width:16px;height:16px}
  .hint{font-size:11.5px;color:var(--ui-muted);margin-top:6px;line-height:1.4}
  .imp{background:#fffde0;border-color:#efe48a}
  .item .ih{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .item .ih .num{font-weight:800;color:#9b3e69;font-size:13px;width:22px}
  .item .ih select{flex:1}
  .mini{border:1px solid var(--ui-line);background:#fff;border-radius:8px;padding:5px 9px;font-size:12px;cursor:pointer;color:#6d3a55}
  .mini:hover{background:var(--rosepale)}
  .mini.danger{color:#a3263b}
  .add{width:100%;border:1.5px dashed #d9b3c5;background:#fdf7fa;color:#9b3e69;border-radius:12px;padding:11px;font-weight:700;cursor:pointer}
  .add:hover{background:var(--rosepale)}
  .pubcard{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-top:12px}
  .pubcard b{display:block;font-size:14px}
  .pubcard span{display:block;font-size:12px;color:var(--ui-muted);margin-top:2px}
  .pubbtn{background:#23764a;color:#fff}
  .robanner{background:#e3f4ea;border:1px solid #bfe3cd;border-radius:14px;padding:12px 14px;margin-bottom:12px;color:#1d5c3a}
  .robanner b{display:block}
  .robanner span{display:block;font-size:12px;margin-top:2px}
  .robanner .mini{margin-top:8px}
  body.ro .form .card:not(.robanner), body.ro .form .add{pointer-events:none;opacity:.6}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#2b1225;color:#fff;padding:11px 18px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:99}
  .toast.on{opacity:1;transform:translateX(-50%)}
  .pv-meta{color:#d9c6d0;font-size:12px;text-align:center;margin-bottom:14px}
  .pwrap{margin:0 auto 22px;box-shadow:0 10px 34px rgba(0,0,0,.45);position:relative}
  .pwrap > .page{transform-origin:0 0;position:absolute;left:0;top:0}

  /* Fenêtres (historique, images) */
  .modal{position:fixed;inset:0;background:rgba(30,6,20,.55);display:none;align-items:center;justify-content:center;z-index:80;padding:16px}
  .modal.on{display:flex}
  .mbox{background:#fff;border-radius:16px;width:min(860px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.35)}
  .mhead{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--ui-line)}
  .mhead h3{font-size:16px}
  .mclose{border:0;background:none;font-size:26px;line-height:1;cursor:pointer;color:var(--ui-muted)}
  .mbody{overflow:auto;padding:16px 18px;flex:1}
  .mfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 18px;border-top:1px solid var(--ui-line)}
  .mbtn{border:1px solid var(--ui-line);background:#fff;border-radius:9px;padding:9px 14px;font-weight:700;cursor:pointer}
  .mbtn.pri{background:#9b2f60;border-color:#9b2f60;color:#fff}
  .mintro{font-size:13.5px;color:#5d4252;line-height:1.45;margin-bottom:14px}
  .merr{background:#fff4ec;color:#9a3f17;border-radius:9px;padding:10px 12px;font-size:13px}
  .imgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .imgrid a{display:block;text-decoration:none;color:var(--ui-muted);font-size:12px;text-align:center}
  .imgrid img{width:100%;display:block;border-radius:8px;box-shadow:0 4px 14px rgba(40,0,25,.25);margin-bottom:6px}
  .htabs{display:flex;gap:6px;margin-bottom:12px}
  .htabs button{border:1px solid var(--ui-line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:700;cursor:pointer;color:#7d5a6e}
  .htabs button.on{background:#7a2a4e;border-color:#7a2a4e;color:#fff}
  .hrow{display:flex;align-items:center;gap:12px;border:1px solid var(--ui-line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
  .hrow.cur{border-color:#c8487f}
  .hrow .hi{flex:1;min-width:0}
  .hrow .hi b{display:block;font-size:14.5px}
  .hrow .hi span{display:block;font-size:12px;color:var(--ui-muted);margin-top:2px}
  .hrow .ha{display:flex;gap:6px;flex-wrap:wrap}
  .hempty{text-align:center;color:var(--ui-muted);padding:30px}

  /* formulaire : blocs */
  .sec-card{border-left:4px solid #B33868}
  .sec-card .sh{display:flex;align-items:center;gap:6px;margin-bottom:8px}
  .sec-card .sh b{flex:1;font-size:13px;color:#9b3e69;letter-spacing:.08em;text-transform:uppercase}
  .blk-card{background:#faf6f8;border:1px solid var(--ui-line);border-radius:12px;padding:10px 12px;margin-top:10px}
  .blk-card .bh{display:flex;align-items:center;gap:6px;margin-bottom:4px}
  .blk-card .bh b{flex:1;font-size:12.5px;color:#7a2a4e}
  .addblk{display:flex;gap:6px;margin-top:10px}
  .addblk select{flex:1}
  .pictos{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
  .pictos button{width:46px;height:46px;border:1.5px solid var(--ui-line);border-radius:10px;background:#fff center/34px no-repeat;cursor:pointer;font-size:10px;color:var(--ui-muted)}
  .pictos button.on{border-color:#B33868;box-shadow:0 0 0 2px rgba(179,56,104,.2)}
  .page .hlr{color:#B33866;font-weight:700}
  .page .tg{font-size:1.22em;line-height:1.3}
  .page .tp{font-size:.86em}
  .page.just .p,.page.just .note{text-align:justify;hyphens:auto;-webkit-hyphens:auto}
  .tbar{display:flex;gap:4px;flex-wrap:wrap;margin:2px 0 4px}
  .tbar button{min-width:30px;height:28px;border:1px solid var(--ui-line);background:#fff;border-radius:7px;cursor:pointer;font-size:13px;padding:0 7px;color:#4a2a3a}
  .tbar button:hover{border-color:#c8487f;color:#B33866}
  .tbar .sep{width:1px;background:var(--ui-line);margin:3px 3px}
  .fmt{font-size:11px;color:var(--ui-muted);margin-top:4px;line-height:1.4}
  .fmt code{background:#f1e8ed;border-radius:4px;padding:0 4px;color:#7a2a4e}

  /* ===== LA FRAME (A4 = 794 × 1123 px) ===== */
  .page{width:794px;height:1123px;position:relative;overflow:hidden;background:#fff;color:#2B2B30;display:flex;flex-direction:column;
    font-family:"T1",Inter,system-ui,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact;--k:1}
  .page .content{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column}
  .page .bottomgap{height:56px;flex:none}
  .page.last .bottomgap{height:0}
  .page .num{position:absolute;right:46px;bottom:16px;width:26px;height:26px;border-radius:50%;background:#B33868;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .page.last .num{display:none}
  .nhd{flex:none;padding:38px 42px 0;display:flex;justify-content:space-between;align-items:center;gap:24px}
  .nhd h1{margin:0;font-size:calc(var(--k)*41px);line-height:1.05;color:#B33868;font-weight:400}
  .nhd h1 b{font-weight:700}
  .nhd .sous{margin-top:6px;font-size:calc(var(--k)*15px);color:#6E6E74}
  .nhd .logo{width:56px;flex:none}
  .avion{flex:none;position:relative;height:136px;margin-top:-6px}
  .avion .band{position:absolute;left:0;right:0;bottom:0;height:47px;background:#B33866}
  .avion img{position:absolute;right:6px;bottom:10px;width:492px;transform:rotate(-2.5deg);transform-origin:60% 70%;filter:drop-shadow(0 4px 4px rgba(60,10,30,.15))}
  .sec{flex:none;padding:calc(var(--k)*20px) 42px;display:flex;flex-direction:column;gap:calc(var(--k)*12px)}
  .sec.rose{background:#FCF6F8}
  .sec.grow{flex:1 0 auto}
  .sh2{display:flex;align-items:flex-end;gap:12px;border-bottom:2px solid #B33868;padding-bottom:8px}
  .sh2 h2{flex:1;margin:0;font-size:calc(var(--k)*23.5px);line-height:1.15;font-weight:400;color:#2B2B30}
  .sh2 h2 b{color:#B33868;font-weight:700}
  .sh2 img{height:calc(var(--k)*52px);width:auto;flex:none;margin-bottom:-2px}
  .p{font-size:11pt;line-height:max(1.32,calc(var(--k)*1.5));margin:0;color:#2B2B30}
  .p b{font-weight:700}
  .page:not(.lettre) .rt .p,.page:not(.lettre) .bx > .p,.page:not(.lettre) .lb{font-size:12pt}
  .note{font-size:calc(var(--k)*12.2px);line-height:1.45;margin:0;color:#66666C}
  .lb{font-size:11pt;font-weight:700;color:#B33868;margin:0}
  .rt{display:flex;flex-direction:column;gap:calc(var(--k)*6px)}
  .ul{display:flex;flex-direction:column;gap:calc(var(--k)*4px)}
  .ul div{display:flex;gap:9px;align-items:baseline}
  .ul span{color:#B33868;font-size:9px;flex:none}
  .stp{display:flex;align-items:center;gap:10px;background:#fff;border-radius:10px;padding:7px 12px}
  .rond{width:24px;height:24px;border-radius:50%;background:#B33868;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
  .bx{background:#F9EEF2;border-radius:12px;padding:calc(var(--k)*12px) 16px;display:flex;flex-direction:column;gap:6px}
  .bx.fonce{background:#B33868}
  .bx.alerte{background:#8E2A52}
  .bx.contour{background:#FCF6F8;border:1px solid #EBD3DC;border-radius:14px}
  .bx.blanc{background:#fff}
  .bx.fonce .p,.bx.fonce .lb,.bx.fonce .note,.bx.alerte .p,.bx.alerte .lb,.bx.alerte .note{color:#fff}
  .bx.fonce .ul span,.bx.alerte .ul span{color:#fff}
  .bx.fonce .stp .p,.bx.alerte .stp .p{color:#2B2B30}
  .g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:stretch}
  .gcol{display:flex;flex-direction:column;gap:12px}
  .enbref{background:#FCF6F8;border:1px solid #EBD3DC;border-radius:14px;padding:calc(var(--k)*14px) 18px;display:flex;flex-direction:column;gap:9px}
  .enbref h3{margin:0;font-size:calc(var(--k)*17px);font-weight:400}
  .enbref h3 b{color:#B33868}
  .enbref .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:calc(var(--k)*7px) 22px}
  .enbref .ck{display:flex;gap:8px;align-items:flex-start}
  .enbref .ck span{color:#B33868;font-weight:700;font-size:14px}
  .enbref .ck .p{font-size:calc(var(--k)*12.8px)}
  .etapes{display:grid;gap:12px}
  .etapes .bx{gap:5px}
  .etapes .bx .p{font-size:calc(var(--k)*12.6px)}
  .chiffres{display:grid;gap:12px}
  .chiffres .val{font-size:calc(var(--k)*28px);font-weight:700;color:#B33868;line-height:1}
  .chiffres .val small{font-size:13px;margin-left:3px}
  .chiffres .p{font-size:calc(var(--k)*12.4px)}
  .tab{border:1px solid #EBD3DC;border-radius:12px;overflow:hidden;background:#fff}
  .tab table{width:100%;border-collapse:collapse}
  .tab th{background:#B33868;color:#fff;font-size:calc(var(--k)*11.5px);font-weight:700;padding:10px 10px;text-align:center;line-height:1.25}
  .tab th:first-child{text-align:left;padding-left:16px}
  .tab td{padding:calc(var(--k)*14px) 10px;border-top:1px solid #EBD3DC;text-align:center;font-size:calc(var(--k)*13px);font-weight:700}
  .tab td:first-child{text-align:left;padding-left:16px}
  .tab.grand td:not(:first-child){color:#B33868;font-size:calc(var(--k)*19px)}
  .tab th+th,.tab td+td{border-left:1px solid #EBD3DC}
  .pers{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
  .pers .lab{color:#B33868;font-weight:700;font-size:calc(var(--k)*13.6px);margin-right:4px}
  .pers .chip{border:1px solid #EBD3DC;background:#fff;border-radius:999px;padding:4px 12px;font-size:calc(var(--k)*12.6px)}
  .roles{background:#fff;border-radius:12px;padding:12px 16px;display:flex;flex-direction:column}
  .roles .lb{margin-bottom:4px}
  .roles .rw{display:grid;grid-template-columns:230px minmax(0,1fr);gap:10px;padding:6px 0}
  .roles .rw+.rw{border-top:1px solid #EBD3DC}
  .roles .k{font-size:calc(var(--k)*12.4px);font-weight:700;color:#B33868}
  .roles .v{font-size:calc(var(--k)*12.4px)}
  .appli{display:flex;gap:20px;align-items:center}
  .appli .badge{display:flex;align-items:center;gap:10px;border:1px solid #EBD3DC;border-radius:12px;padding:10px 14px;flex:none;background:#fff}
  .appli .badge img{width:46px;height:46px;border-radius:11px}
  .appli .badge .st{display:flex;gap:5px;margin-top:5px}
  .appli .badge .st span{background:#2B2B30;color:#fff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:5px}
  .nfin{flex:none;margin-top:auto;background:#B33866;color:#fff;display:flex;align-items:center;gap:16px;padding:20px 42px}
  .nfin .ap{width:52px;height:52px;border-radius:12px}
  .nfin .t{flex:1}
  .nfin .t small{display:block;font-size:12px;opacity:.9}
  .nfin .t b{display:block;font-size:19px;margin-top:2px}
  .nfin .c{text-align:right;font-size:12px}
  .nfin .c b{display:block;font-size:15px;margin-top:2px}
  .nfin .lw{width:44px}
  .nfinw{flex:none;margin-top:auto;position:relative;padding-top:130px}
  .nfinw .nfin{margin-top:0;padding-right:150px}
  .nfinw .pfin{position:absolute;right:0;bottom:0;height:232px;width:auto;z-index:2;filter:drop-shadow(-4px 0 10px rgba(40,5,20,.18))}

  @page{size:A4;margin:0}
  @media print{
    html,body{background:none;height:auto;display:block}
    .top,.form,.tabs,.pv-meta,.toast,.modal{display:none!important}
    .app{display:block}
    .preview{overflow:visible;padding:0;background:none}
    .pwrap{margin:0;box-shadow:none;width:auto!important;height:auto!important;position:static}
    .pwrap > .page{position:relative;transform:none!important;break-after:page}
    .pwrap:last-child > .page{break-after:auto}
  }
  @media screen and (max-width:900px){
    .top{flex-wrap:wrap;gap:10px;padding:10px 12px}
    .top h1{font-size:14px}
    .top .sp{display:none}
    .acts{width:100%;justify-content:space-between}
    .top .lg{display:none}
    .top .btn{padding:9px 12px}
    .app{grid-template-columns:1fr}
    .tabs{display:flex;background:#fff;border-bottom:1px solid var(--ui-line);flex:none}
    .tabs button{flex:1;border:0;background:none;padding:11px;font-weight:700;color:var(--ui-muted);border-bottom:3px solid transparent}
    .tabs button.on{color:#8a2b57;border-color:#b0386c}
    body.tab-apercu .form{display:none}
    body:not(.tab-apercu) .preview{display:none}
    .form{border-right:0;padding:12px 12px 80px}
  }
  /* ===== Modèle « Lettre de section » (Message de …) ===== */
  .page.lettre{background:#EBEBEB}
  .page.lettre .bottomgap{height:46px}
  .lhd{flex:none;position:relative;padding:34px 42px 0;min-height:0}
  .lhd .logo{width:62px;display:block}
  .lhd .plume{position:absolute;right:0;top:0;width:150px}
  .lhd .lab{margin-top:18px;font-size:calc(var(--k)*15px);letter-spacing:.09em;text-transform:uppercase;color:#8E8E93;font-weight:400}
  .lhd .lab b{font-weight:700}
  .lhd h1{margin:4px 0 0;font-size:calc(var(--k)*21px);line-height:1.2;color:#B33866;font-weight:700;padding-right:40px}
  .lhd .salut{display:block;height:calc(var(--k)*34px);margin:calc(var(--k)*18px) 0 calc(var(--k)*2px) -4px}
  .page.lettre .lhd2{flex:none;height:30px}
  .page.lettre .sec{background:none!important;display:block;padding:calc(var(--k)*8px) 42px 0}
  .page.lettre .sec > *{margin-bottom:calc(var(--k)*9px)}
  .page.lettre .blk,.page.lettre .rt{display:block}
  .page.lettre .rt > *{margin-bottom:calc(var(--k)*8px)}
  .page.lettre .rt > *:last-child{margin-bottom:0}
  .page.lettre .ul > div{display:flex;gap:8px}
  .page.lettre .ul > div + div{margin-top:calc(var(--k)*5px)}
  .page.lettre .ul span{color:#2B2B30;font-size:9px;line-height:2.1}
  .lh2{margin:calc(var(--k)*16px) 0 calc(var(--k)*10px)!important;display:flow-root}

/* Texte enrichi : - puce · 1) étape · > note · **gras** */
function rt(t){
  const lines = String(t||"").split("\n"); let h = "", ul = null;
  const flush = () => { if(ul){ h += `<div class="ul">${ul.map(x => `<div><span>●</span><p class="p">${gras(x)}</p></div>`).join("")}</div>`; ul = null; } };
  for(const raw of lines){
    const l = raw.trim(); if(!l){ flush(); continue; }
    let m;
    if((m = l.match(/^[-•]\s+(.*)/))){ (ul = ul || []).push(m[1]); continue; }
    flush();
    if((m = l.match(/^(\d+)[).]\s+(.*)/))) h += `<div class="stp"><span class="rond">${m[1]}</span><p class="p"><b>${gras(m[2])}</b></p></div>`;
    else if((m = l.match(/^>\s*(.*)/))) h += `<p class="note">${gras(m[1])}</p>`;
    else h += `<p class="p">${gras(l)}</p>`;
  }
  flush(); return `<div class="rt">${h}</div>`;
}

    w.appendChild(p); box.appendChild(w); return p.querySelector(".content");
  }
  p.innerHTML = (idx ? "" : `<div class="nhd"><div><h1>${esc(S.titreA)} <b>${esc(S.titreB)}</b></h1><div class="sous">${esc([S.sous, cap(moisLabel(S.mois))].filter(Boolean).join(" · "))}</div></div><img class="logo" src="${IMG}logo-unac-couleur.png" alt="UNAC"></div>
    <div class="avion"><div class="band"></div><img src="${IMG}avion-unac.png" alt=""></div>`) + `<div class="content"></div><div class="bottomgap"></div>${idx ? `<div class="num">${idx+1}</div>` : ""}`;
  w.appendChild(p); box.appendChild(w); return p.querySelector(".content");
}
function buildPages(box){
  box.innerHTML = "";
  let idx = 0, c = newPage(box, 0), alt = 0;
  const grow = () => { const last = c.lastElementChild; if(last && last.classList.contains("sec")) last.classList.add("grow"); };
  const next = () => { grow(); idx++; c = newPage(box, idx); };
  // Lettre : chaque paragraphe est un élément à part, pour couper proprement entre les pages
  const morceaux = b => {
    if(b.type !== "texte") return [blocHTML(b)];
    const out = []; let liste = [];
    const vide = () => { if(liste.length){ out.push(rt(liste.join("\n"))); liste = []; } };
    String(b.texte||"").split("\n").forEach(l => { const t = l.trim(); if(!t){ vide(); return; } if(/^[-•]\s+/.test(t)) liste.push(t); else { vide(); out.push(rt(t)); } });
    vide(); return out;
  };
  const lettreSection = (s, blocs, titre) => {
    const head = titre ? `<div class="lh2"><h2>${esc(s.titreA)}${s.titreB ? ` ${esc(s.titreB)}` : ""}</h2><img src="img/trait.png" alt=""></div>` : "";
    const nodes = []; blocs.forEach(b => morceaux(b).forEach(h => nodes.push(el(`<div class="blk">${h.replace(/<p class="p"><span class="surl">([\s\S]*)<\/span><\/p>/, (m, x) => x.includes("<span class=\"surl\">") ? m : `<p class="p surl-p"><span class="surl">${x}</span></p>`)}</div>`))));
    let sec = el(`<div class="sec">${head}</div>`); c.appendChild(sec);
    nodes.forEach((n, i) => {
      sec.appendChild(n);
      if(overflows(c)){
        sec.removeChild(n);
        const seul = i === 0 && head; // ne pas laisser un intertitre orphelin en bas de page
        if(seul) c.removeChild(sec);
        next(); sec = el(`<div class="sec">${seul ? head : ""}</div>`); c.appendChild(sec); sec.appendChild(n);
      }
    });
  };
  const finLettre = () => {
    const g = SIGNATAIRES[S.photo || "fabrice"] || SIGNATAIRES.aucune, photo = g.photo;
    const sign = (S.signNom || S.signRole) ? el(`<div class="lsign"><b>${esc(S.signNom||"")}</b>${S.signRole ? `<i>${esc(S.signRole)}</i>` : ""}</div>`) : null;
    const pose = () => { // photo en bas à droite de la dernière page, le texte l'habille
      const page = c.closest(".page"); page.querySelectorAll(".lphoto,.lflt-a,.lflt-b").forEach(x => x.remove());
      if(!photo) return;
      const ronde = g.mode === "ronde", duo = g.mode === "binome", fw = ronde ? 230 : duo ? 342 : 205, fh = ronde ? 230 : 345;
      if(duo) g.photos.forEach(([src, r, h], i) => page.insertAdjacentHTML("beforeend", `<img class="lphoto" src="${src}" alt="" style="right:${r}px;height:${h}px;z-index:${3 + i}">`));
      else page.insertAdjacentHTML("beforeend", `<img class="lphoto ${ronde ? "ronde" : ""}" src="${photo}" alt="">`);
      const H = c.clientHeight, zone = fh - 46, sh = sign ? 78 : 0, sw = ronde ? 250 : 300;
      c.style.display = "block";
      if(duo){ // binôme : signature au-dessus des deux photos
        c.insertAdjacentHTML("afterbegin", `<div class="lflt-a" style="height:${Math.max(0, H - zone - sh)}px"></div><div class="lflt-b" style="width:${fw}px;height:${zone + sh}px"></div>`);
        if(sign) Object.assign(sign.style, {position:"absolute", right:"42px", bottom:(fh - 4) + "px", margin:"0", padding:"0"});
        return;
      }
      c.insertAdjacentHTML("afterbegin", `<div class="lflt-a" style="height:${Math.max(0, H - zone)}px"></div><div class="lflt-b" style="width:${fw}px;height:${zone - sh}px"></div>${sh ? `<div class="lflt-b" style="width:${fw + sw}px;height:${sh}px"></div>` : ""}`);
      if(sign) Object.assign(sign.style, {position:"absolute", right:(ronde ? fw + 8 : 262) + "px", bottom:(ronde ? 60 : 64) + "px", margin:"0", padding:"0"});
    };
    if(sign) c.closest(".page").appendChild(sign);
    pose();
    if(overflows(c)){ // pas la place pour la photo et la signature : on emmène les derniers paragraphes sur une nouvelle page
      const page = c.closest(".page"); page.querySelectorAll(".lphoto").forEach(x => x.remove()); c.querySelectorAll(".lflt-a,.lflt-b").forEach(x => x.remove()); c.style.display = "";
      if(sign && sign.parentNode) sign.remove();
      const pris = [];
      for(let n = 0; n < 2; n++){
        const secs = [...c.querySelectorAll(":scope > .sec")], ls = secs[secs.length - 1]; if(!ls) break;
        const blk = [...ls.querySelectorAll(":scope > .blk")].pop(); if(!blk) break;
        ls.removeChild(blk); pris.unshift(blk); if(!ls.querySelector(".blk")) c.removeChild(ls);
        if(blk.textContent.length > 220) break;
      }
      grow(); idx++; c = newPage(box, idx);
      const sec = el(`<div class="sec"></div>`); c.appendChild(sec); pris.forEach(n => sec.appendChild(n));
      if(sign) c.closest(".page").appendChild(sign);
      pose();
    }
  };
  S.sections.forEach(s => {
    const blocs = s.blocs.filter(b => !blocVide(b)); const titre = s.titreA || s.titreB;
    if(!blocs.length && !titre) return;
    const fond = s.fond === "auto" ? (alt++ % 2 ? "rose" : "") : (s.fond === "rose" ? "rose" : "");
    const L = S.modele === "lettre";
    if(L) return lettreSection(s, blocs, titre);
    const head = titre ? `<div class="sh2"><h2>${esc(s.titreA)}${s.titreB ? ` <b>${esc(s.titreB)}</b>` : ""}</h2>${s.picto ? `<img src="${IMG}pictos/${s.picto}.png" alt="">` : ""}</div>` : "";
    const newSec = withHead => el(`<div class="sec ${fond}">${withHead ? head : ""}</div>`);
    let sec = newSec(true); c.appendChild(sec);
    // Les blocs « texte » sont découpés par paragraphe : une section peut ainsi continuer sur la page suivante
    const nodes = []; blocs.forEach(b => morceaux(b).forEach(h => nodes.push(el(`<div class="blk">${h}</div>`))));
    // Le titre part avec au moins le 1er paragraphe (et le 2e si le 1er est très court)
    const lie = titre && nodes.length > 1 && nodes[0].textContent.length < 120 ? 2 : 1;
    const premiers = nodes.slice(0, lie);
    premiers.forEach(n => sec.appendChild(n));
    if(overflows(c) && c.children.length > 1){ c.removeChild(sec); next(); sec = newSec(true); c.appendChild(sec); premiers.forEach(n => sec.appendChild(n)); }
    nodes.slice(lie).forEach(node => {
      sec.appendChild(node);
      if(overflows(c)){ sec.removeChild(node); next(); sec = newSec(false); c.appendChild(sec); sec.appendChild(node); }
    });
  });
  if(S.modele === "lettre"){ finLettre(box); c.closest(".page").classList.add("last"); return box.querySelectorAll(".page").length; }
  // bandeau final
  const PHS = {pascale:[["img/pascale-pierson.png",0]], patricia:[["img/patricia-carniato.png",0]], binome:[["img/patricia-carniato.png",74,190],["img/pascale-pierson.png",0,232]]}[S.photoFin];
  const PH = !!PHS;
  const PR = {pascale:150, patricia:205, binome:245}[S.photoFin] || 150;
  const fin = el(`${PH ? `<div class="nfinw">${PHS.map(([src, r, h], i) => `<img class="pfin" src="${src}" alt="" style="right:${r}px;z-index:${2 + i}${h ? `;height:${h}px` : ""}">`).join("")}` : ""}<div class="nfin"${PH ? ` style="padding-right:${PR}px"` : ""}><img class="ap" src="${IMG}appli-unac.png" alt=""><div class="t"><small>Un doute, une question ?</small><b style="white-space:nowrap">Tchat appli UNAC · 24h/24, 7j/7</b></div><div class="c">${esc(S.contactLabel)}<b>${esc(S.contactMail)}</b></div><img class="lw" src="${IMG}logo-unac-blanc.png" alt=""></div>${PH ? "</div>" : ""}`);
  c.appendChild(fin); if(overflows(c)){ c.removeChild(fin); next(); c.appendChild(fin); }
  grow(); c.closest(".page").classList.add("last");
  return box.querySelectorAll(".page").length;
}
let pvT = null;
function schedulePreview(){ clearTimeout(pvT); pvT = setTimeout(renderPreview, 250); }

/* ---------- Aperçu d'exemple : tant que rien n'est saisi, on montre un document type (filigrane « EXEMPLE ») ---------- */
function exempleDoc(){ return Object.assign(blank(), JSON.parse(JSON.stringify(S && S.modele === "lettre" ? MODELE_LETTRE : MODELE))); }
const enExemple = () => S && S.statut !== "publie" && !hasContent(S);
function renderPreview(){
  const vide = enExemple(), garde = S;
  if(vide) S = exempleDoc();
  try{ renderPreviewReel(); } finally { S = garde; }
  if(vide){
    document.querySelectorAll("#pages .page").forEach(p => { const f = document.createElement("div"); f.className = "filigrane"; f.innerHTML = "<span>EXEMPLE</span>"; p.appendChild(f); });
    const m = document.getElementById("pvMeta"); if(m) m.innerHTML = `<span class="ex">Exemple de rendu</span>Remplissez les champs${document.getElementById("impOpen") || document.getElementById("aImport") ? " ou importez des notes" : ""} : votre contenu remplacera cet exemple.`;
  }
}
function renderPreviewReel(){
  const stage = document.createElement("div"); stage.style.cssText = "position:fixed;left:-20000px;top:0;visibility:hidden;width:900px"; document.body.appendChild(stage);
  let best = null;
  for(let i=0;i<DENSITES.length;i++){ DENS = DENSITES[i]; const n = buildPages(stage); if(!best || n < best.n) best = {i, n}; }
  DENS = DENSITES[best.i]; const n = buildPages(stage);
  const box = $("#pages"); box.innerHTML = ""; while(stage.firstChild) box.appendChild(stage.firstChild); stage.remove();
  fitPreview();
  $("#pvMeta").textContent = `${n} page${n>1?"s":""} · ${S.sections.length} section${S.sections.length>1?"s":""} · mise en page ${DENS.nom} (auto) · A4`;
}
function fitPreview(){ const pv = $("#preview"); const k = Math.min(pv.clientWidth - 40, 794) / 794; document.querySelectorAll(".pwrap").forEach(w => { w.style.width = (794*k)+"px"; w.style.height = (1123*k)+"px"; w.firstChild.style.transform = `scale(${k})`; }); }
window.addEventListener("resize", fitPreview);

/* ---------- PDF / images / onglets ---------- */
let tab = "saisie";
function syncTab(){ document.body.classList.toggle("tab-apercu", tab === "apercu"); document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab)); if(tab === "apercu") fitPreview(); }
$("#tabs").addEventListener("click", e => { const b = e.target.closest("button"); if(b){ tab = b.dataset.tab; syncTab(); } });
$("#pdfBtn").addEventListener("click", async () => { if(enExemple()) return toast("Remplissez d’abord le document : l’aperçu n’est qu’un exemple");
  renderPreview(); if(document.fonts) await document.fonts.ready;
  await Promise.all([...document.querySelectorAll("#pages img")].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
  const old = document.title; document.title = `Newsletter ${S.titreA} ${S.titreB} - ${moisLabel(S.mois)}`.replace(/\s+/g," "); document.body.classList.add("tab-apercu");
  setTimeout(() => { window.print(); setTimeout(() => { document.title = old; syncTab(); }, 500); }, 60);
});
window.nomExport = () => `Newsletter-${S.titreA}-${S.titreB}-${moisLabel(S.mois)}`.replace(/[^\wÀ-ÿ-]+/g, "-").replace(/-+/g, "-");
window.titreExport = () => `${S.titreA} ${S.titreB} · ${moisLabel(S.mois)}`;
$("#imgBtn").addEventListener("click", () => { if(enExemple()) return toast("Remplissez d’abord le document : l’aperçu n’est qu’un exemple"); return exportImages(); });
$("#mailBtn").addEventListener("click", () => { if(enExemple()) return toast("Remplissez d’abord le document : l’aperçu n’est qu’un exemple"); return envoyerMail(); });

/* ---------- Publication, historique ---------- */
function publier(){
  if(S.statut === "publie") return;
  if(!hasContent(S)) return toast("Rien à publier");
  if(!confirm(`Publier la newsletter de ${moisLabel(S.mois)} ?\n\nElle passera dans « Publiées » et ne sera plus modifiable (vous pourrez en faire un nouveau brouillon).`)) return;
  S.statut = "publie"; S.publieLe = Date.now(); DOCS[S.id] = S; persist(); openDoc(S); toast("Newsletter publiée");
}
$("#resetBtn").addEventListener("click", () => {
  if(S.statut === "brouillon" && hasContent(S) && !confirm("Recommencer à zéro ?\n\nUne nouvelle newsletter vierge est créée. Le brouillon actuel reste disponible dans « Historique ».")) return;
  openDoc(blank()); toast("Nouvelle newsletter vierge");
});
const HM = $("#histModal"); let onglet = "brouillons";
HM.addEventListener("click", e => { if(e.target === HM || e.target.hasAttribute("data-x")) HM.classList.remove("on"); });
$("#hNew").addEventListener("click", () => { HM.classList.remove("on"); openDoc(blank()); });
$("#histBtn").addEventListener("click", () => { persist(); onglet = S.statut === "publie" ? "publies" : "brouillons"; renderHist(); HM.classList.add("on"); });
function renderHist(){
  const all = Object.values(DOCS).filter(d => hasContent(d) || d.id === S.id);
  const br = all.filter(d => d.statut === "brouillon").sort((a,b) => b.maj - a.maj), pu = all.filter(d => d.statut === "publie").sort((a,b) => b.mois.localeCompare(a.mois) || b.publieLe - a.publieLe);
  const list = onglet === "brouillons" ? br : pu;
  const dt = ts => new Date(ts).toLocaleDateString("fr-FR") + " à " + new Date(ts).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
  $("#hBody").innerHTML = `<div class="htabs"><button data-t="brouillons" class="${onglet==="brouillons"?"on":""}">Brouillons (${br.length})</button><button data-t="publies" class="${onglet==="publies"?"on":""}">Publiées (${pu.length})</button></div>`
    + (list.length ? list.map(d => `<div class="hrow ${d.id===S.id?"cur":""}" data-id="${d.id}"><div class="hi"><b>${esc(d.titreA)} ${esc(d.titreB)} · ${esc(cap(moisLabel(d.mois)))}</b><span>${d.sections.length} section(s) · ${d.statut === "publie" ? "publiée le " + dt(d.publieLe) : "modifiée le " + dt(d.maj)}${d.id===S.id?" · ouverte":""}</span></div>
      <div class="ha">${d.id===S.id?"":`<button class="mini" data-h="open">${d.statut==="publie"?"Consulter":"Ouvrir"}</button>`}<button class="mini" data-h="dup">${d.statut==="publie"?"Nouveau brouillon":"Dupliquer"}</button><button class="mini danger" data-h="del">Supprimer</button></div></div>`).join("")
      : `<div class="hempty">${onglet === "brouillons" ? "Aucun brouillon." : "Aucune newsletter publiée pour le moment."}</div>`);
}
$("#hBody").addEventListener("click", e => {
  const t = e.target.closest("[data-t]"); if(t){ onglet = t.dataset.t; return renderHist(); }
  const b = e.target.closest("[data-h]"); if(!b) return;
  const d = DOCS[b.closest(".hrow").dataset.id];
  if(b.dataset.h === "open"){ HM.classList.remove("on"); return openDoc(d); }
  if(b.dataset.h === "dup"){ HM.classList.remove("on"); return copyToDraft(d); }
  if(b.dataset.h === "del"){ if(!confirm(`Supprimer définitivement la newsletter de ${moisLabel(d.mois)} de cet appareil ?`)) return; delete DOCS[d.id]; if(S.id === d.id){ S = latestDraft() || blank(); DOCS[S.id] = S; openDoc(S); } persist(); renderHist(); }
});

/* ---------- Brouillon : partage / fichier / modèle ---------- */
const menu = $("#menu");
$("#menuBtn").addEventListener("click", e => { e.stopPropagation(); menu.classList.toggle("open"); });
document.addEventListener("click", e => { if(!menu.contains(e.target)) menu.classList.remove("open"); });
const exportable = () => { const o = JSON.parse(JSON.stringify(S)); ["id","statut","cree","maj","publieLe"].forEach(k => delete o[k]); return o; };
async function deflate(str){ const cs = new Blob([new TextEncoder().encode(str)]).stream().pipeThrough(new CompressionStream("deflate-raw")); const buf = new Uint8Array(await new Response(cs).arrayBuffer()); let s = ""; buf.forEach(x => s += String.fromCharCode(x)); return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
async function inflate(s){ let b = s.replace(/-/g,"+").replace(/_/g,"/"); while(b.length % 4) b += "="; const ds = new Blob([Uint8Array.from(atob(b), c => c.charCodeAt(0))]).stream().pipeThrough(new DecompressionStream("deflate-raw")); return await new Response(ds).text(); }
function recevoir(o){
  if(!o || !Array.isArray(o.sections)) return toast("Brouillon non reconnu");
  const d = Object.assign(blank(), o, {id:uid(), statut:"brouillon", cree:Date.now(), maj:Date.now()});
  d.sections.forEach(s => { s.id = s.id || uid(); s.blocs.forEach(b => b.id = b.id || uid()); }); openDoc(d); toast("Newsletter ouverte dans un nouveau brouillon");
}
$("#aPublish").addEventListener("click", () => { menu.classList.remove("open"); publier(); });
$("#aShare").addEventListener("click", async () => { menu.classList.remove("open"); const url = location.origin + location.pathname + "#d=" + await deflate(JSON.stringify(exportable())); try{ await navigator.clipboard.writeText(url); toast("Lien copié : à coller dans un message"); }catch(e){ prompt("Copiez ce lien :", url); } });
$("#aSave").addEventListener("click", () => { menu.classList.remove("open"); const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(exportable(), null, 1)], {type:"application/json"})); a.download = `newsletter-${S.mois}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); });
$("#aOpen").addEventListener("click", () => { menu.classList.remove("open"); $("#fileJson").click(); });
$("#fileJson").addEventListener("change", async e => { const f = e.target.files[0]; e.target.value = ""; if(!f) return; try{ recevoir(JSON.parse(await f.text())); }catch(err){ toast("Fichier illisible"); } });
$("#aDemo").addEventListener("click", () => { menu.classList.remove("open"); if((S.statut === "publie" || hasContent(S)) && !confirm("Ouvrir la newsletter de novembre 2026 dans un nouveau brouillon ?")) return; recevoir(MODELE); });

/* ---------- Démarrage ---------- */
(async function(){
  try{ DOCS = JSON.parse(localStorage.getItem(DOCS_KEY) || "{}") || {}; }catch(e){ DOCS = {}; }
  S = DOCS[localStorage.getItem(CUR_KEY)] || latestDraft() || null;
  if(!S) S = blank();
  DOCS[S.id] = S;
  document.body.classList.toggle("ro", S.statut === "publie");
  renderForm(); if(document.fonts) await document.fonts.ready; renderPreview();
  if(location.hash.startsWith("#d=")){ try{ const o = JSON.parse(await inflate(location.hash.slice(3))); history.replaceState(null, "", location.pathname); recevoir(o); }catch(e){ toast("Lien de brouillon illisible"); } }
  window.addEventListener("load", renderPreview);
})();

</script>
